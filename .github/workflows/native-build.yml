name: Pocketlog Native Build

# 네이티브가 빌드되는지만 본다 (072). 결과물을 남기지 않고 서명·업로드도 하지 않는다.
#
# 3티어 중 Tier 2다. Tier 1(모든 PR의 lint·tsc·jest)은 ci.yml이고, 서명·업로드(Tier 3)는
# 이 워크플로가 하지 않는다.
#
# 네이티브에 닿는 PR에서만 돈다. 경로 필터는 워크플로 단위라 ci.yml과 한 파일에 섞을 수 없다.
# 이 워크플로 파일 자신도 목록에 있어, 고친 PR에서 곧바로 검증된다(pull_request는 PR 브랜치의
# 워크플로 파일을 쓴다).
#
# 필수 체크로 올리지 않는다. 경로 필터로 건너뛴 워크플로의 필수 체크는 「대기 중」에 머물러 PR을
# 막는다. 머지를 막지 않는 것은 저장소 설정(브랜치 보호)이라 이 파일로는 정할 수 없다.
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - app.json
      - plugins/**
      - .github/workflows/native-build.yml
  push:
    branches: [main]
  workflow_dispatch:

# 같은 ref에서 새 실행이 시작되면 앞선 실행을 취소한다. 연달아 push하면 중간 커밋의 깨짐은
# 확인되지 않을 수 있다 — 받아들인 결정이다(072 Clarifications).
concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

# 비밀값을 쓰지 않으므로 토큰도 읽기만 준다.
permissions:
  contents: read

# 단계별 걸린 시간은 단계 끝(실패 포함)에 실행 요약에 적는다 — trap EXIT가 실패해도 돈다.
jobs:
  # 안드로이드: 네이티브 프로젝트를 새로 만들고 arm64 하나로 debug 빌드한다.
  #
  # release가 아니라 debug인 이유: plugins/with-release-signing.js가 release에 키스토어를
  # 요구해 서명 없는 release는 돌지 않는다. release 최적화 컴파일과 서명은 안드로이드 release
  # 빌드·서명·보관 과제(후속)에서 정한다. 따라서 이 확인은 release 단계의 메모리 부족을
  # 재현하지 못할 수 있다.
  #
  # arm64 하나인 이유: 네 ABI를 다 빌드하면 llama.rn의 CPU 갈래 10여 벌을 동시에 컴파일하다
  # 로컬에서 clang이 out of memory로 죽었다. 출시 대상도 arm64뿐이다.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: 러너 사양
        run: |
          {
            echo "### 안드로이드 (ubuntu-latest)"
            echo "- CPU: $(nproc)코어"
            echo "- 메모리: $(free -m | awk '/Mem:/{print $2}') MB"
            echo
            echo "| 단계 | 걸린 시간 |"
            echo "| --- | --- |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: expo prebuild
        run: |
          start=$(date +%s)
          trap 'echo "| prebuild | $(( $(date +%s) - start ))초 |" | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          npx expo prebuild --platform android --clean
      # 캐시가 없어도 결과는 같다 — 느릴 뿐이다. android/는 prebuild --clean이 지우는 생성물이라
      # 그 안은 캐시하지 않는다.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      # 메모리는 5초마다 머신 전체 사용량(총량 - 사용 가능량)을 적는다. 짧은 스파이크는 놓친다 —
      # 상한이 아니라 경향을 본다.
      - name: gradle assembleDebug (arm64)
        working-directory: android
        run: |
          start=$(date +%s)
          ( while true; do awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{print int((t-a)/1024)}' /proc/meminfo >> "$RUNNER_TEMP/mem.log"; sleep 5; done ) &
          sampler=$!
          trap 'kill $sampler 2>/dev/null; echo "| gradle assembleDebug | $(( $(date +%s) - start ))초 |" | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
      - name: 최대 메모리 사용량
        if: always()
        run: |
          peak=$(sort -n "$RUNNER_TEMP/mem.log" 2>/dev/null | tail -1)
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "최대 메모리 사용: ${peak:-기록 없음} MB (5초 간격 샘플)" | tee -a "$GITHUB_STEP_SUMMARY"

  # iOS: macOS 러너에서 네이티브 프로젝트를 새로 만들고 서명 없이 시뮬레이터용으로 빌드한다.
  #
  # Debug인 이유: 안드로이드 debug와 구성을 맞춘다. Release 아카이브와 서명은 iOS 빌드·업로드
  # 과제(후속)의 몫이다. 산출물(DerivedData)은 ios/ 밖에 둔다 — prebuild --clean이 ios/를 지운다.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: 러너 사양
        run: |
          {
            echo "### iOS (macos-latest)"
            echo "- CPU: $(sysctl -n hw.ncpu)코어"
            echo "- 메모리: $(( $(sysctl -n hw.memsize) / 1048576 )) MB"
            echo "- $(sw_vers -productName) $(sw_vers -productVersion), $(xcodebuild -version | head -1)"
            echo
            echo "| 단계 | 걸린 시간 |"
            echo "| --- | --- |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: expo prebuild
        run: |
          start=$(date +%s)
          trap 'echo "| prebuild | $(( $(date +%s) - start ))초 |" | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          npx expo prebuild --platform ios --clean --no-install
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            pods-${{ runner.os }}-
      - name: pod install
        working-directory: ios
        run: |
          start=$(date +%s)
          trap 'echo "| pod install | $(( $(date +%s) - start ))초 |" | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          pod install
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dd
          key: dd-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            dd-${{ runner.os }}-
      - name: xcodebuild (시뮬레이터, 서명 없음)
        run: |
          start=$(date +%s)
          trap 'echo "| xcodebuild | $(( $(date +%s) - start ))초 |" | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          xcodebuild -workspace ios/Pocketlog.xcworkspace -scheme Pocketlog -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" -quiet CODE_SIGNING_ALLOWED=NO build
