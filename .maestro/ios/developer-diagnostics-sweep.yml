# iOS 시뮬레이터 — 개발자 메뉴·진단·상태 흉내를 눌러 본다 (068, 훑기).
#
# **`scripts/run-device-tests.mjs`의 `FLOWS`에 등록하지 않았다** — 등록하지 않은 흐름은 아무것도 검증하지 않는다(AGENTS 「Maestro」).
# `settings-sweep.yml`과 같다: 끝까지 간다는 것은 앱이 살아 있다는 뜻뿐이고 Metro `ERROR`·`simctl log show`는 따로 읽는다.
# 개발 환경(`dev`)에서만 의미가 있다(개발자 행이 처음부터 있다). 홈에서 시작한다. 상태를 바꾸는 「지금 한 번 써 보기」·「온보딩부터 다시」는 맨 끝에 있다.
appId: com.a810labs.pocketlog
---
- launchApp:
    stopApp: false
- runFlow: _dismiss-open-prompt.yml
- tapOn:
    id: "home-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "settings-developer"
- tapOn:
    id: "settings-developer"
- extendedWaitUntil:
    visible:
      id: "developer-screen"
    timeout: 5000
- takeScreenshot: ios-developer-top

# 모듈 다시 받기 — 모두 준비돼 있으면 토스트(파일을 지우지 않는다)
- tapOn:
    id: "developer-redownload"
- waitForAnimationToEnd
- takeScreenshot: ios-developer-redownload

# 상태 흉내 — 날짜 대화상자
- scrollUntilVisible:
    element:
      id: "sim-date"
- tapOn:
    id: "sim-date"
- extendedWaitUntil:
    visible:
      id: "sim-date-dialog"
    timeout: 5000
- tapOn:
    id: "sim-date-cancel"
- extendedWaitUntil:
    notVisible:
      id: "sim-date-dialog"
    timeout: 5000

# T030: 상태 흉내 토글 (sim-fail, sim-empty, sim-nophoto) 켜고 끄기
- scrollUntilVisible:
    element:
      id: "sim-fail-toggle"
- tapOn:
    id: "sim-fail-toggle"
- tapOn:
    id: "sim-empty-toggle"
- tapOn:
    id: "sim-nophoto-toggle"
- waitForAnimationToEnd:
    timeout: 2000
# 토글 끄기 (원래 상태로 복구)
- tapOn:
    id: "sim-fail-toggle"
- tapOn:
    id: "sim-empty-toggle"
- tapOn:
    id: "sim-nophoto-toggle"
- waitForAnimationToEnd:
    timeout: 2000

# 진단 겹
- scrollUntilVisible:
    element:
      id: "developer-diagnostics"
- tapOn:
    id: "developer-diagnostics"
- extendedWaitUntil:
    visible:
      id: "diagnostics-screen"
    timeout: 5000
- takeScreenshot: ios-diagnostics-top

# T029: 저장 점검
- scrollUntilVisible:
    element:
      id: "diagnostics-storage"
- tapOn:
    id: "diagnostics-storage"
- waitForAnimationToEnd:
    timeout: 3000

# T029: 신호 다시 읽기
- scrollUntilVisible:
    element:
      id: "diagnostics-probe-refresh"
- tapOn:
    id: "diagnostics-probe-refresh"
- waitForAnimationToEnd:
    timeout: 3000

# T029: 프리셋 전환
- scrollUntilVisible:
    element:
      id: "diagnostics-preset-photos"
- tapOn:
    id: "diagnostics-preset-photos"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "diagnostics-preset-empty"
- waitForAnimationToEnd:
    timeout: 2000

# 자동 쓰기 지금 실행
- scrollUntilVisible:
    element:
      id: "diagnostics-run-auto"
- tapOn:
    id: "diagnostics-run-auto"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-diagnostics-run-auto
- scrollUntilVisible:
    element:
      id: "diagnostics-group-failures"
- takeScreenshot: ios-diagnostics-bottom

# 닫는 수단 — iOS에는 BackHandler가 없다: 「← 설정」(back-to-developer)·「← 일기」로 돌아온다
- tapOn:
    id: "back-to-developer"
- extendedWaitUntil:
    visible:
      id: "developer-screen"
    timeout: 5000

# T028: 개발자 메뉴 끄기 (설정 화면으로 가고 settings-developer가 사라짐)
- scrollUntilVisible:
    element:
      id: "developer-off"
- tapOn:
    id: "developer-off"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- assertNotVisible:
    id: "settings-developer"

# 홈으로 돌아오기
- tapOn:
    id: "back-to-home"
- extendedWaitUntil:
    visible:
      id: "home-settings"
    timeout: 5000

# ── 상태를 바꾸는 두 버튼은 맨 끝에 둔다 (068 T033) ──────────────────────────
# 위에서 「개발자 메뉴 끄기」를 눌렀으므로 개발자 행이 이 실행 동안 사라졌다 — 앱을 다시 띄워 되살린다(기본 `launchApp`은 앱을 종료했다 다시 띄운다).
- launchApp
- runFlow: _dismiss-open-prompt.yml
- extendedWaitUntil:
    visible:
      id: "home-settings"
    timeout: 30000

# 진단 「지금 한 번 써 보기」 — 세 겹이 닫히고 홈에서 쓰기가 시작된다. 쓰기가 끝나길 기다린다.
# ⚠️ iOS 시뮬레이터에서는 이 쓰기가 **실패한다**(「일기를 쓰지 못했어요.」 토스트, `write-failures.json`의 `unwritten`) — 2026-10-10 실측,
#    로드맵 「iOS 시뮬레이터에서 일기 생성이 실패하는 원인 찾기」. 이 흐름은 「버튼이 오류 없이 쓰기를 시작하고 끝난다」까지만 본다 —
#    **일기가 저장된다는 것을 검증하지 않는다**(저장되면 쓴 날 홈이 보인다).
- tapOn:
    id: "home-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "settings-developer"
- tapOn:
    id: "settings-developer"
- scrollUntilVisible:
    element:
      id: "developer-diagnostics"
- tapOn:
    id: "developer-diagnostics"
- extendedWaitUntil:
    visible:
      id: "diagnostics-screen"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "diagnostics-try-once"
- tapOn:
    id: "diagnostics-try-once"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: "stop-button"
    timeout: 240000
- takeScreenshot: ios-try-once-result

# 개발자 「온보딩부터 다시」 — 온보딩 게이트가 열렸다 닫히고(모델 파일은 지우지 않는다) 홈으로 돌아온다.
- tapOn:
    id: "home-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "settings-developer"
- tapOn:
    id: "settings-developer"
- scrollUntilVisible:
    element:
      id: "developer-replay-onboarding"
- tapOn:
    id: "developer-replay-onboarding"
- repeat:
    while:
      notVisible:
        id: "home-settings"
    times: 20
    commands:
      - runFlow:
          when:
            visible: "허용"
          commands:
            - tapOn: "허용"
      - runFlow:
          when:
            visible:
              id: "onboarding-start"
          commands:
            - tapOn:
                id: "onboarding-start"
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    id: "home-settings"
