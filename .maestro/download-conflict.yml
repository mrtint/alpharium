# 실기기 자동 테스트 — 내려받기 충돌 (008)
#
# ─────────────────────────────────────────────────────────────────────────────
# **이 흐름이 008의 두 P1 스토리를 본다.**
#
# 007까지 받는 중에 다른 캐릭터를 누르면 **아무 일도 일어나지 않았고**(거부가 화면에
# 닿지 않았다), 받던 것의 진행률과 멈추기 버튼이 **함께 사라져** 사용자가 갇혔다.
#
# 검증 항목:
#   FR-001   거부되었다는 것이 보인다
#   FR-002   무엇을 받는 중인지 알린다
#   FR-003   빠져나갈 길을 말한다
#   FR-004   안내에 모델 정보가 없다              (원칙 III)
#   FR-007   거부당한 줄이 평소대로다
#   FR-008   ★ 받던 것의 진행 표시가 남는다        (버그 ②)
#   FR-009   ★ 멈추기 버튼이 남는다                (버그 ②)
#   FR-013   탭을 왕복해도 받는 중인 것이 보인다
#
# ─────────────────────────────────────────────────────────────────────────────
# **⚠️ 이 흐름은 실제 내려받기가 있어야 의미가 있다.**
#
# 두 버그 모두 **받는 중일 때만** 나타난다. 그래서 아래 조건부 블록은 「받는 중」이
# 화면에 있을 때만 안쪽이 돈다 — **받는 중이 아니면 SKIPPED로 지나가며, 건너뛴 것은
# 통과가 아니다**(원칙 V). 그때는 quickstart.md F1~F4를 손으로 확인한다.
#
# **아직 받지 않은 둘**(`english`·`chinese`)을 쓴다 — 아래 주석 참조.
#
# **여기서 자동화하지 않는 것** — quickstart.md F3·F4·F9:
#   멈춘 뒤 재요청이 통하는가       — 멈춤이 끝나기를 기다려야 하고 타이밍이 기기마다
#                                     다르다. 사람이 확인한다(F3)
#   탭 밖에서 진척이 실제로 느는가  — 두 시점의 백분율을 비교해야 한다. 사람이 확인한다(F4)
#   release 빌드에서 도는가         — 빌드가 15~31분이다. 사람이 확인한다(F9)
#
# ⚠️ **부분 문자열은 정규식으로 준다** — Maestro의 기본 매칭은 텍스트 노드 **전체**와
# 맞춰 보므로 `"받는 중"`은 「받는 중… 42%」와 맞지 않는다(007 실측).
#
# ✅ **`testID`가 release(R8·ProGuard)에서 살아남는다**(2026-08-21 실측). 이 흐름이
# 이 저장소에서 처음으로 `testID`에 기댔고, `id:` 셀렉터가 실제로 잡혔다.
#
# ⚠️ **다만 `childOf`로 줄 안의 버튼을 좁힐 수 없다**(2026-08-21 실측). 줄에
# `character-row-*`를 주어도 **Maestro가 버튼을 그 줄의 자식으로 보지 않는다** —
# `uiautomator dump`로 보면 좌표는 줄 안(x=824~968 ⊂ 68~1013)인데 접근성 트리에서는
# **형제로 평탄화**돼 있다. 그래서 **버튼마다 `action-*` testID를 따로 준다.**
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

# 캐릭터 탭으로. 첫 화면은 일기다(006 FR-009).
- tapOn: "캐릭터"

# 다섯 자리가 보이는 것을 먼저 확인한다 — 이것이 안 되면 아래가 전부 무의미하다.
# **스크롤해서 찾는다**: 진단 패널이 있는 dev 빌드에서는 목록이 아래로 밀린다.
- scrollUntilVisible:
    element: "english"
    direction: DOWN

# ─────────────────────────────────────────────────────────────────────────────
# **⚠️ 이미 준비된 캐릭터로는 이 검증을 할 수 없다**(2026-08-21 실측).
#
# 「쓸 수 있음」인 줄의 버튼은 **「지우기」**이지 「준비하기」가 아니다. 그래서 받는
# 중으로 만들 수 없고, 누르면 **모델이 지워진다.**
#
# 처음 이 흐름은 `quiet`을 썼는데, 기기에서 `quiet`·`narrative`가 이미 준비돼 있어
# **「준비하기」를 찾지 못하고 실패했다.** 아직 받지 않은 둘을 쓴다 —
# `english`로 받기 시작하고 `chinese`로 거부를 부른다.
#
# **이 둘이 이미 준비돼 있으면 이 흐름은 돌 수 없다.** 그때는 SKIPPED가 아니라
# FAILED로 드러나며, **quickstart F1~F4를 손으로 확인한다**(원칙 V).
# ─────────────────────────────────────────────────────────────────────────────
- tapOn:
    id: "action-english"

# ─────────────────────────────────────────────────────────────────────────────
# 여기서부터는 **받는 중일 때만** 참이다.
#
# ⚠️ 조건을 **좁게** 잡는다. 007에서 「사진.*」으로 걸었더니 진단 화면의 「사진 접근」이
# 걸려 일기가 없는데도 안쪽이 돌아 실패했다 — dev 빌드에는 진단 패널이 함께 뜨므로
# **목록 밖의 글자가 조건에 걸린다.**
# ─────────────────────────────────────────────────────────────────────────────
- runFlow:
    when:
      visible: ".*받는 중.*"
    commands:
      # ★ FR-009 — 받는 중이면 멈추기가 있다. 이것이 아래 검증의 전제다.
      - assertVisible:
          id: "pause-english"

      # 받는 중에 **다른 캐릭터**를 누른다 — 여기가 두 버그가 나던 자리다.
      - scrollUntilVisible:
          element: "chinese"
          direction: DOWN
      # **버튼의 testID로 누른다** — `childOf`로는 좁힐 수 없다(아래 주석 참조).
      - tapOn:
          id: "action-chinese"

      # ── FR-001·002·003 — 거부가 보이고, 무엇을 멈춰야 하는지 말한다 ──
      #
      # ⚠️ **`.*멈추.*`만 걸면 안 된다.** 받는 중인 줄의 **「멈추기」 버튼**과도 맞아서
      # **안내가 아예 안 떠도 통과한다** — 검사가 제 대상을 가리지 못한다.
      - assertVisible:
          id: "download-notice"
      # **안내 문구 전체를 한 번에 본다.** `childOf`로 좁힐 수 없으므로(위 주석),
      # **거부 안내에만 있는 문장**을 통째로 맞춘다 — 「받는 중이라 지금은 받을 수
      # 없다」와 「멈추면 받을 수 있다」는 이 안내 말고는 화면에 없다. 그래서
      # 「멈추기」 버튼과 헷갈릴 수 없다.
      - assertVisible: '.*english.* 받는 중이라 지금은 받을 수 없다.*'
      - assertVisible: '.*english.* 멈추면 받을 수 있다.*'

      # ── ★ FR-008·009 — 받던 것이 사라지지 않는다 (버그 ②) ──
      #
      # **007까지 여기서 진행률과 멈추기가 함께 사라졌다.** 그러면 사용자는 받는 줄도
      # 모르고, 멈출 수도 없고, 다른 것도 못 받는 상태에 갇혔다.
      - assertVisible:
          id: "pause-english"
      # english이 여전히 받는 중이다. **백분율이 붙은 문구**를 본다 — 「받는 중… N%」는
      # 받는 중인 줄에만 나온다.
      - assertVisible: ".*받는 중.*%.*"

      # ── FR-004 — 안내에 모델 정보가 없다 (원칙 III) ──
      - assertNotVisible: "kanana"
      - assertNotVisible: "exaone"
      - assertNotVisible: "hyperclova"
      - assertNotVisible: "gguf"
      - assertNotVisible: "Q4"

      # ── FR-013 — 탭을 왕복해도 받는 중인 것이 보인다 ──
      #
      # ★ 007까지 탭을 옮기면 `Acquisition` 인스턴스가 통째로 사라져, 돌아왔을 때
      # 받던 것을 **멈출 방법이 없었다.**
      - tapOn: "일기"
      - tapOn: "캐릭터"
      - scrollUntilVisible:
          element: "english"
          direction: DOWN
      - assertVisible:
          id: "pause-english"

      # 멈춰 둔다 — 다음 실행에 GB 내려받기가 이어지지 않게 한다.
      - tapOn:
          id: "pause-english"
