name: Pocketlog Android Release

# 안드로이드 release AAB를 서명해 Play 내부 테스트 트랙으로 올린다 (076).
# 개발 기계와 로컬 서명 키 없이 소유자가 GitHub에서 손으로 시작한다 — 006·065의 로컬 절차를 러너로 옮긴 것이다.
#
# 업로드 키와 Play 배포 권한이 퍼블릭 저장소의 러너에서 쓰이므로 비밀이 새는 길을 잠근다(075 iOS와 같은 틀). 계약은
# specs/076-android-release-ci/contracts/workflow-contract.md, 잠금은 __tests__/ci/android-release-workflow.test.ts:
#   - 시작 방법은 수동 하나뿐이다. PR·push·예약이 없으니 포크 PR이 비밀에 닿을 길이 없다.
#   - 비밀은 보호 환경 android-release에만 있다(필수 리뷰어 = 소유자, 배포 브랜치 = main — 저장소 설정이라
#     이 파일이 강제하지 못한다. quickstart §2에서 소유자가 눈으로 확인한다).
#   - 비밀은 단계의 env로만 받고 run 본문에 보간하지 않는다. 명령 추적을 켜지 않고 값을 출력하지 않는다.
#   - AAB를 아티팩트로 남기지 않는다. 퍼블릭 저장소라 누구나 내려받는다. 결과물은 Play로만 간다.
#   - 캐시를 쓰지 않는다(actions/cache도 setup-node의 cache도). 서명 키가 열린 빌드에서 캐시 복원은 오염 경로다(072의 gradle 캐시도 여기서는 쓰지 않는다).
#   - 마지막 정리 단계는 성공·실패와 무관하게 키스토어 파일과 AAB를 지운다.
#
# android.versionCode 올림은 사람이 커밋한다(CI는 올리지 않는다). 같은 번호는 Play가 거부하므로 「번호 점검」 단계가 긴 빌드 전에
# Play의 번들 번호를 읽어(읽기 전용, 096) 이번 번호가 마지막보다 크지 않으면 이미 있는 번호를 밝히며 실패한다. 읽지 못해도 실패한다.
# 서명 설정은 plugins/with-release-signing.js가 선언한다 — 이 파일은 android/ 를 고치지 않고 키스토어 파일과 비밀번호
# 환경변수만 준다. 서명 키가 debug 키이거나 저장소의 기대 지문과 다르면 업로드 전에 실패한다.
on:
  workflow_dispatch:

# 동시에 하나만 돈다. 진행 중인 실행은 취소하지 않는다 — 업로드 도중 취소로 반쪽 상태가 되지 않게.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 90
    steps:
      # 토큰을 .git/config에 남기지 않는다 — 이 워크플로는 push하지 않고, npm·gradle 스크립트가 키스토어가 열린 빌드 중에 돈다.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # package-manager-cache: false — setup-node v5는 package.json에 packageManager 필드가 있으면 캐시를 자동으로 켠다.
      # 키스토어가 열리는 잡에서 캐시 복원은 오염 경로이므로(FR-008) 기본값에 기대지 않고 끈다.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: 러너 사양
        run: |
          {
            echo "### 안드로이드 릴리스 (ubuntu-latest)"
            echo "- CPU: $(nproc)코어"
            echo "- 메모리: $(free -m | awk '/Mem:/{print $2}') MB"
            echo "- $(. /etc/os-release && echo "$PRETTY_NAME"), $(java -version 2>&1 | head -1)"
            echo "- 버전 $(node -p "require('./app.json').expo.version") (versionCode $(node -p "require('./app.json').expo.android.versionCode"))"
            echo
            echo "| 단계 | 걸린 시간 |"
            echo "| --- | --- |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # 값이 비면 14분짜리 빌드 전에 이름만 밝히고 끝낸다. 값은 찍지 않는다. 이 단계는 비밀이 든 유일한 사전 점검이라
      # 저장소 코드(node)를 부르지 않는다 — 비밀을 쓰지 않는 점검은 다음 단계(설정 점검)가 한다.
      - name: 사전 점검
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          failed=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::비밀 $name 이(가) 비어 있다 (보호 환경 android-release의 secrets)"
              failed=1
            fi
          done
          exit "$failed"
      # 기대 지문 파일이 없으면 서명 확인이 반드시 실패하므로 여기서 먼저 알린다. 비밀이 env에 없는 단계다.
      - name: 설정 점검
        run: |
          failed=0
          code=$(node -p "require('./app.json').expo.android.versionCode")
          case "$code" in
            ''|*[!0-9]*)
              echo "::error::app.json의 expo.android.versionCode 가 정수가 아니다"
              failed=1
              ;;
          esac
          node --no-warnings=MODULE_TYPELESS_PACKAGE_JSON scripts/android-release/verify-signature.mts --check-expected-only || failed=1
          # 릴리스 노트(release-notes/ko.txt)가 비었거나 500자를 넘으면 긴 빌드 전에 끝낸다. Play 「출시 노하우」로 간다.
          node --no-warnings=MODULE_TYPELESS_PACKAGE_JSON scripts/release-notes/check.mts --store play || failed=1
          exit "$failed"
      # 096 — 이번 versionCode가 Play의 마지막 번호보다 큰지 긴 빌드 전에 본다. 읽기 전용이다(편집은 열었다가 버린다).
      # npm ci 앞이라 의존성 설치 스크립트가 서비스 계정을 보지 못한다 — 스크립트는 Node 내장만 쓰는 저장소 코드 하나다.
      # 값은 찍지 않고, 통과하면 번호와 커밋의 대응 한 줄을 요약에 남긴다. 못 읽으면(권한·네트워크) 건너뛰지 않고 실패한다.
      - name: 번호 점검
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          line=$(node --no-warnings=MODULE_TYPELESS_PACKAGE_JSON scripts/android-release/version-check.mts \
            --app-json app.json --package com.a810labs.pocketlog --commit "$GITHUB_SHA")
          {
            echo
            echo "### 번호 점검"
            echo "- $line"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: expo prebuild
        run: |
          start=$(date +%s)
          trap 'echo "| prebuild | $(( $(date +%s) - start ))초 |" | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          npx expo prebuild --platform android --clean
      # android/ 는 prebuild --clean 이 지우는 생성물이라 prebuild 뒤에 복원한다. 경로는 플러그인 선언
      # (app.json의 keystorePath = pocketlog.jks → android/app/) 과 같다. 소유자만 읽는 권한으로 푼다.
      - name: 키스토어 복원
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > android/app/pocketlog.jks
          test -s android/app/pocketlog.jks || { echo "::error::키스토어를 복원하지 못했다 (ANDROID_KEYSTORE_BASE64 확인)"; exit 1; }
      # 비밀번호는 gradle이 ORG_GRADLE_PROJECT_<이름> 환경변수를 프로젝트 속성 <이름>으로 읽는 것으로 전달한다
      # (플러그인이 findProperty('POCKETLOG_STORE_PASSWORD')로 읽는다) — 디스크에 비밀번호 파일이 생기지 않는다.
      # NODE_ENV=production 이 없으면 Metro 번들이 .env.production 을 못 읽어 앱이 「이 빌드는 잘못 만들어졌다」로 뜬다.
      # 메모리는 5초마다 머신 전체 사용량(총량 - 사용 가능량)을 적는다. 짧은 스파이크는 놓친다 — 경향을 본다.
      # 부족해 죽으면 gradle 병렬도를 낮춰 다시 돌리고 값과 근거를 quickstart에 남긴다(FR-015).
      - name: gradle bundleRelease
        working-directory: android
        env:
          NODE_ENV: production
          ORG_GRADLE_PROJECT_POCKETLOG_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_POCKETLOG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          start=$(date +%s)
          ( while true; do awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{print int((t-a)/1024)}' /proc/meminfo >> "$RUNNER_TEMP/mem.log"; sleep 5; done ) &
          sampler=$!
          trap 'kill $sampler 2>/dev/null; echo "| gradle bundleRelease | $(( $(date +%s) - start ))초 |" | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a
      # 서명이 debug 키이거나 저장소의 기대 지문(upload-key.sha256)과 다르면 여기서 끝난다 — Play에 닿지 않는다.
      - name: 서명 확인
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          size=$(stat -c %s "$aab")
          result=$(node --no-warnings=MODULE_TYPELESS_PACKAGE_JSON scripts/android-release/verify-signature.mts "$aab")
          {
            echo
            echo "### 서명 확인"
            echo "- AAB 크기: $(( size / 1048576 )) MB"
            echo "$result" | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Play 업로드
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          start=$(date +%s)
          trap 'echo "| Play 업로드 | $(( $(date +%s) - start ))초 |" | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          node --no-warnings=MODULE_TYPELESS_PACKAGE_JSON scripts/android-release/play-upload.mts \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --package com.a810labs.pocketlog --track internal --notes release-notes/ko.txt
      - name: 최대 메모리 사용량
        if: always()
        run: |
          peak=$(sort -n "$RUNNER_TEMP/mem.log" 2>/dev/null | tail -1)
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "최대 메모리 사용: ${peak:-기록 없음} MB (5초 간격 샘플)" | tee -a "$GITHUB_STEP_SUMMARY"
      # 성공·실패와 무관하게 돈다. 이 단계 뒤에 다른 단계를 두지 않는다.
      - name: 정리
        if: always()
        run: |
          rm -f android/app/pocketlog.jks android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/mem.log"
          echo "정리 완료: 키스토어·AAB 삭제"
