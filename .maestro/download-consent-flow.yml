# 실기기 자동 테스트 — 다운로드 동의 안내와 진행 슬라이드 (045)
#
# ─────────────────────────────────────────────────────────────────────────────
# 검증 항목:
#   045 FR-001·002   권한 확인 직후 동의 Dialog가 먼저 뜨고, 확인 전엔
#                     다운로드가 시작되지 않는다
#   045 FR-002a      Dialog에 [확인/시작] 외의 조작이 없다
#   045 FR-003       모델 식별자·바이트 크기가 화면에 없다(원칙 III·IV)
#   045 FR-004~007   동의 확인 후 4장 슬라이드가 순서대로 전환되고,
#                     완료 화면에서 다음 단계로 넘어가는 버튼이 보인다
#   045 FR-008       다운로드 완료 전에는 작명 화면에 도달하지 않는다
#
# **여기서 자동화하지 않는 것**(quickstart.md D1~D5 참고):
#   새 설치 → 권한 온보딩 → 동의 → 다운로드 전체 흐름은 `pm clear` +
#   GB 단위 에셋 다운로드가 필요하다 — 035·040의 첫 실행 흐름과 같은 이유로
#   사람이 quickstart.md D1~D5를 직접 확인한다. 이 흐름은 **이미 필수 자산이
#   준비된 기기**를 전제로, 동의·다운로드 화면이 정상 사용자 경로에 재노출되지
#   않는지(FR-009, D4)와 모델 정보 미노출(FR-003)만 회귀 확인한다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V) — D1~D3(동의 Dialog
# 노출·슬라이드 전환·작명 게이트)는 quickstart.md에 따라 사람이 직접 본다.
#
# ⚠️ 부분 문자열은 정규식으로 준다(007 실측). ⚠️ testID로 짚는다(R8 생존).
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

# 필수 자산이 이미 준비된 기기(정상 사용 경로)에서는 동의·다운로드 화면이
# 전혀 보이지 않고 곧장 일기 탭(또는 작명 화면 대기)으로 간다(FR-009, D4).
- assertNotVisible:
    id: "download-consent-dialog"
- assertNotVisible:
    id: "download-progress-screen"
- assertNotVisible:
    id: "download-progress-complete"

# ── 모델 정보 미노출 회귀 확인 (FR-003, 원칙 III) ─────────────────────────
# 이미 다운로드 화면을 지나쳤더라도, 그 화면들이 쓰던 문구·식별자가 다른
# 화면에 잔존해 노출되지 않는지 앱 전역에서 재확인한다.
- assertNotVisible: ".*ESSENTIAL_ASSET_KEYS.*"
- assertNotVisible: ".*v1\\.bin.*"
- assertNotVisible: ".*v2\\.bin.*"
- assertNotVisible: ".*a1\\.bin.*"
