<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="575" viewBox="0 0 1260 575" role="img"><style>text{font-family:'NanumSquare','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif;}.sub{font-size:17px;fill:#67605C}.label{font-size:18px;font-weight:700;fill:#39312E}</style><rect width="1260" height="575" fill="#FFFFFF"/><text x="45" y="55" font-size="30" fill="#39312E" font-weight="700" >CHARACTER PRESENCE BY CONTEXT</text><text x="45" y="86" font-size="17" fill="#625753" font-weight="400" >일기 읽기 경험을 방해하지 않도록 화면 맥락에 따라 캐릭터의 비중을 조절</text><rect x="35" y="117" width="396" height="398" rx="20" fill="#FFF8F0" stroke="#E6D9D0"/><text x="57" y="152" font-size="17" fill="#9C493C" font-weight="700" >ONBOARDING</text><g transform="translate(227,278) scale(1.12)"><path d="M-42 -22 Q-62 -75 -79 -46 Q-85 -1 -48 14" fill="#D98176" stroke="#39312E" stroke-width="5"/><path d="M42 -22 Q62 -75 79 -46 Q85 -1 48 14" fill="#D98176" stroke="#39312E" stroke-width="5"/><ellipse cx="0" cy="4" rx="51" ry="48" fill="#FFF8F0" stroke="#39312E" stroke-width="5"/><circle cx="-18" cy="0" r="4.5" fill="#39312E"/><circle cx="18" cy="0" r="4.5" fill="#39312E"/><path d="M-7 17 Q0 23 7 17" stroke="#39312E" fill="none" stroke-width="3.5" stroke-linecap="round"/><path d="M-5 12 L0 8 L5 12 Z" fill="#D98176"/></g><text x="128" y="389" font-size="22" fill="#39312E" font-weight="700" >안녕! 내 이름을 지어줘.</text><text x="57" y="475" font-size="20" fill="#39312E" font-weight="700" >높음</text><text x="57" y="501" font-size="16" fill="#625753" font-weight="400" >첫 만남 · 이름 짓기</text><rect x="455" y="117" width="396" height="398" rx="20" fill="#FFF8F0" stroke="#E6D9D0"/><text x="477" y="152" font-size="17" fill="#9C493C" font-weight="700" >WRITING</text><g transform="translate(653,273) scale(0.91)"><path d="M-44 -17 L-53 -67 L-12 -42 L12 -42 L53 -67 L44 -17" fill="#D98176" stroke="#39312E" stroke-width="5" stroke-linejoin="round"/><ellipse cx="0" cy="7" rx="48" ry="45" fill="#FFF8F0" stroke="#39312E" stroke-width="5"/><circle cx="-18" cy="0" r="4.5" fill="#39312E"/><circle cx="18" cy="0" r="4.5" fill="#39312E"/><path d="M-7 17 Q0 23 7 17" stroke="#39312E" fill="none" stroke-width="3.5" stroke-linecap="round"/><path d="M-5 12 L0 8 L5 12 Z" fill="#D98176"/><path d="M-28 15 l-30 -4 M-28 21 l-30 8" stroke="#39312E" stroke-width="2" fill="none"/><path d="M28 15 l30 -4 M28 21 l30 8" stroke="#39312E" stroke-width="2" fill="none"/></g><rect x="529" y="377" width="248" height="51" rx="12" fill="#B94B3A"/><text x="559" y="410" font-size="17" fill="#FFFFFF" font-weight="700" >오늘의 일기를 쓰는 중</text><text x="477" y="475" font-size="20" fill="#39312E" font-weight="700" >중간~높음</text><text x="477" y="501" font-size="16" fill="#625753" font-weight="400" >일기를 작성하는 동안</text><rect x="875" y="117" width="396" height="398" rx="20" fill="#FFF8F0" stroke="#E6D9D0"/><text x="897" y="152" font-size="17" fill="#9C493C" font-weight="700" >READING</text><rect x="900" y="190" width="346" height="172" rx="11" fill="#FFFDF9"/><text x="925" y="231" font-size="18" fill="#9C493C" font-weight="700" >10월 12일  /  일기</text><text x="925" y="281" font-size="21" fill="#39312E" font-weight="400" >너의 하루를 생각했어.</text><g transform="translate(950,330) scale(0.23)"><path d="M-44 -17 L-53 -67 L-12 -42 L12 -42 L53 -67 L44 -17" fill="#D98176" stroke="#39312E" stroke-width="5" stroke-linejoin="round"/><ellipse cx="0" cy="7" rx="48" ry="45" fill="#FFF8F0" stroke="#39312E" stroke-width="5"/><circle cx="-18" cy="0" r="4.5" fill="#39312E"/><circle cx="18" cy="0" r="4.5" fill="#39312E"/><path d="M-7 17 Q0 23 7 17" stroke="#39312E" fill="none" stroke-width="3.5" stroke-linecap="round"/><path d="M-5 12 L0 8 L5 12 Z" fill="#D98176"/><path d="M-28 15 l-30 -4 M-28 21 l-30 8" stroke="#39312E" stroke-width="2" fill="none"/><path d="M28 15 l30 -4 M28 21 l30 8" stroke="#39312E" stroke-width="2" fill="none"/></g><text x="987" y="338" font-size="16" fill="#625753" font-weight="400" >루이가 썼어요</text><text x="897" y="475" font-size="20" fill="#39312E" font-weight="700" >낮음</text><text x="897" y="501" font-size="16" fill="#625753" font-weight="400" >작은 서명·화자 확인</text><text x="47" y="558" font-size="16" fill="#625753" font-weight="400" >캐릭터 이미지는 특정 디자인 방향의 구조적 예시이며 브랜드의 최종 캐릭터 에셋이 아닙니다.</text></svg>