# 실기기 자동 테스트 — 오늘의 일기 (012 → 049)
#
# ─────────────────────────────────────────────────────────────────────────────
# **049 — 앱을 열면 오늘이 골라져 있고, 시각과 상관없이 오늘을 쓸 수 있다**(정오 제한 폐지,
# 하루 경계는 기기 로컬 자정). 012의 「정오 이전엔 "몇 시부터" 안내」는 사라졌다.
#
# 검증 항목:
#   049 FR-010a  앱을 열면 오늘(밑줄 칸)이 골라져 있다                          (M1)
#   049 FR-018b  언제 열어도 쓰기 버튼이 있다 — 「…부터 쓸 수 있어요」가 없다   (M2)
#   FR-006·007   걸음·배터리·연결이 화면에 없다                                (원칙 V)
#   FR-011~013   이미 있는 하루를 다시 쓰면 확인을 거친다                      (M3)
#   FR-013       확인 화면에 모델 정보·진행률이 없다                          (원칙 III·IV)
#
# **여기서 자동화하지 않는 것** — quickstart.md B2 D1~D13:
#   오늘을 실제로 생성하는 것(049 D8)             — 캐릭터·모델이 필요하다. 사람이 확인한다.
#   자정을 실제로 넘나드는 순간(049 FR-019)         — 기기 날짜를 바꿀 수 없다(root 필요).
#                                                     기기 없는 테스트(HS2)가 주된 검증이다.
#   release에서 도는가                             — 빌드에 시간이 걸린다. 사람이 확인한다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# ⚠️ 부분 문자열은 정규식으로 준다(007 실측). ⚠️ `childOf`를 쓰지 않는다(008 실측) —
# `testID`를 하루마다 따로 준다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.a810labs.pocketlog
---
- launchApp

- assertVisible: "일기"

# ★ M1 — **고르는 자리가 있고, 오늘이 골라져 있다.** 049 — 일~토 주간 스트립(`day-strip`),
# 오늘 칸은 숫자 밑줄(`day-today-*`)로만 구분된다(헤더에 「오늘」 글자가 없다).
- assertVisible:
    id: "day-strip"
- assertVisible:
    id: "day-today-.*"
- assertVisible:
    id: "day-.*"
    selected: true
- assertNotVisible:
    id: "home-day-fade-out"

# ★ M2 — **언제 열어도 쓸 수 있다.** 049가 정오 제한을 없앴다 — 쓰기 버튼이 있고,
# 048의 「오늘 일기는 … 쓸 수 있어요」 안내가 없다. 051 수정 — 오늘 일기가 길면 「다시 쓰기」는 지면
# 끝에 닿아야 올라오므로 내려서 찾는다.
- scrollUntilVisible:
    element:
      id: "write-button"
    direction: DOWN
    timeout: 20000
# 051 수정 — 하단 바는 날짜 조각이 없는 전폭 블록이다(보드 `1d`·`2c`).
- assertNotVisible:
    id: "write-day-label"
- assertNotVisible:
    id: "write-unavailable"
- assertNotVisible: ".*부터 쓸 수 있어요.*"

# ★ 축 제외 — **걸음·배터리·연결이 화면 어디에도 없다**(FR-006·007). 목록·고르는
# 자리·확인 화면 전부에 대한 전역 검사다.
- assertNotVisible: "걸음"
- assertNotVisible: "배터리"
- assertNotVisible: "연결:"

# ★ 모델 정보가 없다(원칙 III).
- assertNotVisible: "kanana"
- assertNotVisible: "exaone"
- assertNotVisible: "hyperclova"
- assertNotVisible: "gguf"

# ★ M3 — **이미 있는 하루를 골라 쓰면 확인을 거친다**(FR-011). 049 — 고른 날에 일기가
# 있으면 헤더 상태 줄은 「… 쓸 수 있어요」가 아니라 그 일기의 제목(또는 「이 날 일기를
# 썼어요」)이다.
- runFlow:
    when:
      notVisible: ".*일기를 쓸 수 있어요"
    commands:
      - tapOn:
          id: "write-button"
      # ★ 확인 대화상자가 뜨고 곧바로 생성되지 않는다(050 — 홈 위의 대화상자, 보드 2d).
      - assertVisible:
          id: "overwrite-dialog"
      - assertVisible:
          id: "overwrite-confirm"
      - assertVisible: "취소"
      # ★ 확인 화면에 진행률·모델 정보가 없다(원칙 III·IV).
      - assertNotVisible: "%"
      - assertNotVisible: "kanana"
      - assertNotVisible: "exaone"
      # 취소하면 홈으로 돌아가고 아무것도 생성되지 않는다.
      - tapOn:
          id: "overwrite-cancel"
      - assertVisible:
          id: "day-strip"

# 홈이 아니면 돌아간다 — 051부터 결과·실패 화면의 뒤로 가기 글자는 「← 일기」다.
- runFlow:
    when:
      visible: "← 일기"
    commands:
      - tapOn: "← 일기"

- runFlow:
    when:
      notVisible:
        id: "day-strip"
    commands:
      - back

- assertVisible:
    id: "day-strip"
