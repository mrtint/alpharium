# 059 — 개발자 화면은 설정 → 「개발자」 행(`settings-developer`)이다. 개발 환경(local·dev)은 7번 탭 없이 처음부터 켜져 있다.
#       진단은 개발자 화면의 「진단」 행(`developer-diagnostics`) 뒤에 있다(개발 환경 전용 — 배포 빌드에는 행도 화면도 없다).
# 실기기 자동 테스트 — 뼈대 검증 (FR-021f)
#
# 시뮬레이터로 대체하지 않는다. 시뮬레이터에는 네이티브 추론 모듈이 없어 검증 대상
# 자체가 없기 때문이다.
#
# 검증 항목:
#   FR-001 앱이 실기기에서 뜬다
#   FR-006 추론 모듈 적재 — 060 이후 진단에 적재 줄이 없다. 실제 적재는 층 2 흐름(실제 모델로 쓰기)이 본다
#   FR-012 실기기에서 추론 위치가 온디바이스다
#   FR-017 현재 환경과 추론 위치가 보인다
#
# 002 검증 항목:
#   파일 저장이 실기기에서 실제로 돈다 — expo-file-system 57의 File/Paths API를
#   이 저장소에서 처음 돌려보는 자리다. 나머지 002는 순수 함수라 npm test로 끝나지만
#   이 어댑터만은 실제 파일 시스템이 있어야 확인된다.
#
# 실행: npm run test:device (기기가 없거나 Maestro가 없으면 건너뛴다)
#
# 주의: 이 흐름은 앱이 실기기에서 온디바이스로 도는 것을 검증한다. dev 배포본이든
# local에서 실기기를 붙였든, 실기기라면 네이티브 모듈이 적재되고 추론은 기기에서
# 돌아야 한다. 환경 이름 자체는 검증하지 않는다 — Metro를 어느 env로 띄웠는지에
# 따라 달라지므로, 그것까지 고정하면 테스트가 실행 방식에 묶인다.
appId: com.a810labs.pocketlog
---
- launchApp

# 진단 화면은 개발 환경(local·dev) 전용이다 — 홈의 점 셋 → 설정 → 개발자 → 진단. prod 빌드에는 진단 행이 없어 이 흐름 자체가 돌지 않는다.
# 059 — 설정 → 개발자 → 진단. 개발 환경은 「개발자」 행이 처음부터 있다(7번 탭 불필요).
- tapOn:
    id: "home-settings"
- scrollUntilVisible:
    element:
      id: "settings-developer"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-developer"
- tapOn:
    id: "developer-diagnostics"

# 073 — 진단 화면이 060에서 보드 6h의 일곱 묶음으로 바뀌어 옛 줄(「모듈 상태」·「loaded」·「on-device」·「ok — 저장·조회…」)이 사라졌다.
# 지금 보이는 것으로 같은 뜻을 본다.
#
# FR-001 — 앱이 죽지 않고 뜨고, 진단 화면과 「환경」 묶음이 보인다
- extendedWaitUntil:
    visible:
      id: "diagnostics-screen"
    timeout: 10000
- assertVisible:
    id: "diagnostics-group-env"
- assertVisible: "환경"
- assertVisible: "추론 위치"

# FR-012·017 — 추론 위치가 기기다(로컬 서버가 아니다). 이 줄은 llama-port의 GPU_LAYERS=0 고정에 근거한 표시이고,
# 060 계약 테스트가 그 상수가 바뀌면 문구도 같이 고치게 한다. 네이티브 모듈이 실제로 적재되는지는 층 2(실제로 일기를 쓴다)가 본다.
- assertVisible: "기기 · CPU"

# 002 — 파일 저장이 실기기에서 실제로 돈다
# 060이 옛 왕복 점검을 일기를 다시 읽어 세는 점검으로 바꿨다: 「N편 · 정상」이어야 하고 「읽기 실패」가 붙으면 깨진 일기가 있다.
- scrollUntilVisible:
    element:
      id: "diagnostics-group-storage"
    direction: DOWN
    timeout: 20000
- assertVisible: "저장 점검"
# 저장 점검 행은 눌러야 값이 펼쳐진다(›)
- tapOn:
    id: "diagnostics-storage"
- assertVisible:
    text: ".*편 · 정상"
- assertNotVisible:
    text: ".*읽기 실패.*"
