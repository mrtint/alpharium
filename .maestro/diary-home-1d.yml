# 실기기 자동 테스트 — 048 일기 홈 1d와 화면 이동 구조
#
# ─────────────────────────────────────────────────────────────────────────────
# **홈이 보드 `1d` 구조로 그려지고, 탭 줄 없이 `⋯` 메뉴로 설정에 들어갔다 돌아오는가**를 본다.
#
# 검증 항목:
#   FR-001·009·023  탭 줄·메뉴 없이 헤더·스트립이 보인다                   (M1)
#   (051 수정 — ⋯ 메뉴·「n일」 조각을 없애 M2~M5를 걷어냈다)
#   055  월 라벨 줄 오른쪽 점 세 개(home-settings) → 설정 → 「‹ 일기」·뒤로 가기로 홈 (M6)
#
# ─────────────────────────────────────────────────────────────────────────────
# **★ 여기서 자동화하지 않는 것 — quickstart.md §3:**
#
#   정오 전 오늘 선택·안내 문구(D6), 12:00 전환(D7)  — 기기 시각을 바꿀 수 없다.
#   신호 줄 숫자가 합성 하루의 장수와 같은가(D3~D5)   — seed:day와 권한 조작이 필요하다.
#   prod에서 「개발자」 항목이 없는가(SC-006)         — prod 환경 Metro가 필요하다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

# 045 — 다운로드 완료 화면의 「시작할게요」는 세션 로컬 상태라 재시작마다 다시 뜬다(welcome-naming.yml
# 참조). 뜨면 지나간다.
- extendedWaitUntil:
    visible:
      id: "download-progress-complete|home-month"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "download-progress-complete"
    commands:
      - tapOn:
          id: "download-progress-proceed"
- extendedWaitUntil:
    visible:
      id: "home-month"
    timeout: 20000

# ★ M1 — 1d 구조. 탭 줄도 `⋯` 메뉴도 없다(051 수정 — 저장소 소유자 지시로 메뉴를 없앴다. 보드 `1d`·`2c`의
# 하단 바는 화면 폭 전체의 쓰기 블록 하나다). 신호 줄은 안 쓴 날에만 있어 여기서 보지 않는다 — 기본 선택이
# 오늘이고 기기에 오늘 일기가 있을 수 있다.
- assertVisible:
    id: "home-month"
- assertVisible:
    id: "home-day-number"
- assertVisible:
    id: "day-strip"
- assertNotVisible:
    id: "home-menu-button"
- assertNotVisible:
    id: "write-day-label"
# 055 — 월 라벨 줄 오른쪽은 설정 버튼(점 세 개, 보드 `6a`)이다. 048의 「일기」 글자는 없다.
- assertVisible:
    id: "home-settings"

# M2~M5(⋯ → 설정 → 「← 일기」·뒤로 가기·메뉴 바깥 누름·「n일」 조각)는 051 수정에서 걷어냈다 — 메뉴와 날짜
# 조각이 사라졌다. 055 — 설정 진입이 생겼다(M6).

# ★ M6 — 점 세 개 → 설정이 홈 위에 겹친다 → 「‹ 일기」로 홈. 다시 열고 시스템 뒤로로 홈.
- tapOn:
    id: "home-settings"
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 5000
- assertVisible: "캐릭터"
- tapOn:
    id: "back-to-home"
- extendedWaitUntil:
    notVisible:
      id: "settings-title"
    timeout: 5000
- assertVisible:
    id: "home-settings"
- tapOn:
    id: "home-settings"
- extendedWaitUntil:
    visible:
      id: "settings-title"
    timeout: 5000
- back
- extendedWaitUntil:
    notVisible:
      id: "settings-title"
    timeout: 5000
- assertVisible:
    id: "home-day-number"

# ★ 원칙 III·IV — 홈 어디에도 모델 정보·진행 지표가 없다.
- assertNotVisible: "kanana"
- assertNotVisible: "gguf"
- assertNotVisible: "%"
