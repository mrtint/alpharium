# 실기기 자동 테스트 — 오늘의 일기 (012)
#
# ─────────────────────────────────────────────────────────────────────────────
# **009가 「지난 사흘」만 허용하던 것을 정오 이후 「오늘」까지 열었는지 본다.**
#
# 검증 항목:
#   FR-001·001a  정오 이후 오늘이 고르는 자리에 있다 (셋 그대로, 그그제 대신)   (M1)
#   FR-002       정오 이전엔 오늘이 없고 "몇 시부터" 안내가 뜬다               (M2)
#   FR-006·007   걸음·배터리·연결이 화면에 없다                                (원칙 V)
#   FR-011~013   이미 있는 하루를 다시 쓰면 확인을 거친다                      (M3)
#   FR-013       확인 화면에 모델 정보·진행률이 없다                          (원칙 III·IV)
#
# **여기서 자동화하지 않는 것** — quickstart.md B2 D1~D13:
#   정오 이후 오늘을 실제로 골라 생성하는 것(D2)   — 이 기능의 핵심 검증. 캐릭터·모델이
#                                                     필요하고, 기기의 지금 시각이 실제로
#                                                     정오 이후여야 한다. 사람이 확인한다.
#   정오 경계를 실제로 넘나드는 순간(D1·D8)         — 기기 날짜를 바꿀 수 없다(root 필요).
#                                                     기기 없는 테스트가 주된 검증이다.
#   release에서 도는가                             — 빌드에 시간이 걸린다. 사람이 확인한다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# ⚠️ 부분 문자열은 정규식으로 준다(007 실측). ⚠️ `childOf`를 쓰지 않는다(008 실측) —
# `testID`를 하루마다 따로 준다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

- assertVisible: "일기"

# ★ M1/M2 — **고르는 자리가 있다.** 048 — 7칸 스트립(`day-strip`)이고, 처음 골라진
# 날은 언제나 쓸 수 있는 날이라 하단 바에 [일기 쓰기 │ n일]이 있다(D9).
- assertVisible:
    id: "day-strip"
- assertVisible:
    id: "day-.*"
    selected: true
- assertVisible:
    id: "write-day-label"

# ★ FR-002 → 048 — **정오 전 오늘을 고르면 쓰기 버튼 대신 「… 쓸 수 있어요」가 보인다.**
# 스트립의 마지막 칸이 오늘이다 — 날짜를 모르므로 「쓸 수 있는 때」 칸으로 가른다:
# 정오 전이면 기본 선택(어제)의 칸은 「지금」이고, 오늘을 골랐을 때만 시각이 나온다.
# 오늘 날짜를 미리 알 수 없어 칸을 직접 누르지는 않는다 — quickstart D6이 손으로 본다.

# ★ 축 제외 — **걸음·배터리·연결이 화면 어디에도 없다**(FR-006·007). 목록·고르는
# 자리·확인 화면 전부에 대한 전역 검사다.
- assertNotVisible: "걸음"
- assertNotVisible: "배터리"
- assertNotVisible: "연결:"

# ★ 모델 정보가 없다(원칙 III).
- assertNotVisible: "kanana"
- assertNotVisible: "exaone"
- assertNotVisible: "hyperclova"
- assertNotVisible: "gguf"

# ★ M3 — **이미 있는 하루를 골라 쓰면 확인을 거친다**(FR-011). 048 — 고른 날에 일기가
# 있으면 헤더 상태 줄이 「이미 썼어요 · 다시 쓰면 덮어써요」다.
- runFlow:
    when:
      visible: "이미 썼어요 · 다시 쓰면 덮어써요"
    commands:
      - tapOn:
          id: "write-button"
      # ★ 확인 화면이 뜨고 곧바로 생성되지 않는다.
      - assertVisible: "확인"
      - assertVisible: "취소"
      # ★ 확인 화면에 진행률·모델 정보가 없다(원칙 III·IV).
      - assertNotVisible: "%"
      - assertNotVisible: "kanana"
      - assertNotVisible: "exaone"
      # 취소하면 홈으로 돌아가고 아무것도 생성되지 않는다.
      - tapOn: "취소"
      - assertVisible:
          id: "day-strip"

# 목록이 아니면 돌아간다.
- runFlow:
    when:
      visible: "← 목록"
    commands:
      - tapOn: "← 목록"

- runFlow:
    when:
      notVisible:
        id: "day-strip"
    commands:
      - back

- assertVisible:
    id: "day-strip"
