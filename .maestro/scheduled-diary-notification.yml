# 실기기 자동 테스트 — 시간대 지정 자동 일기 작성과 완성 알림 (020)
#
# ─────────────────────────────────────────────────────────────────────────────
# **019 스파이크가 검증한 백그라운드 생성 경로를 제품 기능으로 만든 것을 본다.**
#
# 검증 항목:
#   FR-001       자동 생성 설정 화면에 목표 시각 선택·on/off 토글이 있다        (M1)
#   FR-002·SC-001 근사치 안내 문구가 보인다("그 무렵에")                        (M2)
#   FR-010       배터리 예외 상시 링크가 화면에 있다                            (M3)
#   FR-002       정밀도를 암시하는 문구("정각"/"매일 7시")가 없다              (원칙 II)
#   원칙 III      설정·알림에 모델 정보가 없다                                  (M4)
#
# **여기서 자동화하지 않는 것** — quickstart.md §2·§3·§4:
#   실제 백그라운드 트리거(§2c)      — 기기의 시각을 바꿀 수 없고(root 필요) Doze
#                                       조건을 만들려면 실제로 오래 방치해야 한다.
#   SC-002 24h 무예외 소크(§2c/T053b) — 24시간 실제 방치. 사람이 확인한다.
#   SC-003 배터리 예외 라운드(§2c/T053a) — adb whitelist 조작 + 관측. 사람이 확인한다.
#   알림 발생·탭 라우팅(§3)          — 실제 생성 완료가 있어야 알림이 뜬다.
#                                       콜드 스타트(§3a)는 force-stop이 필요하다.
#   경합 재현(§4)                    — 개발자 탭 트리거 버튼 + 타이밍. 사람이 확인한다.
#   release에서 도는가(§6)           — 새 네이티브 모듈의 R8 통과. 사람이 확인한다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# ⚠️ 부분 문자열은 정규식으로 준다(007 실측). ⚠️ `childOf`를 쓰지 않는다(008 실측).
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

# 설정 탭으로 간다 — 자동 생성 설정은 prod에도 있는 사용자 화면이라 개발자 탭이
# 아니라 설정 탭에 있다(020 App.tsx `AutoDiarySection`이 `settings` 갈래에서 그려짐).
- runFlow:
    when:
      visible: "설정"
    commands:
      - tapOn: "설정"

# ★ M1 — **자동 생성 설정 화면이 있고, 목표 시각·토글이 보인다.**
- scrollUntilVisible:
    element:
      text: ".*자동.*일기.*"
    direction: DOWN
    timeout: 20000

# ★ M2 — **근사치 안내 문구가 보인다**(FR-002·SC-001).
- assertVisible:
    text: ".*무렵.*"

# ★ M3 — **배터리 예외 상시 링크가 있다**(FR-010, batteryExceptionPrompted와 무관).
- assertVisible:
    text: ".*배터리 설정.*"

# ★ 원칙 II — **정밀도를 암시하는 문구가 없다**(FR-002).
- assertNotVisible:
    text: ".*정각.*"
- assertNotVisible:
    text: ".*매일 (오전 )?7시.*"

# ★ M4 — **모델 정보가 없다**(원칙 III).
- assertNotVisible: "kanana"
- assertNotVisible: "exaone"
- assertNotVisible: "hyperclova"
- assertNotVisible: "gguf"

# ★ 개발자 탭에 "지금 자동 생성 트리거" 디버그 버튼이 존재한다(경합 재현용,
#   quickstart.md §4). 눌러도 크래시하지 않는다(실제 생성 완주는 사람이 확인).
- runFlow:
    when:
      visible: ".*지금.*자동.*생성.*"
    commands:
      - assertVisible:
          text: ".*지금.*자동.*생성.*"
