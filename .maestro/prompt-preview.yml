# 060 — 진단 화면이 보드 6h의 일곱 묶음으로 바뀌었다(프롬프트 미리보기 = 「입력 프롬프트 미리보기」 묶음, 캐릭터 칩 없음 — 로스터 하나).
# 059 — 개발자 화면은 설정 → 「개발자」 행(`settings-developer`)이다. 개발 환경(local·dev)은 7번 탭 없이 처음부터 켜져 있다.
#       진단은 개발자 화면의 「진단」 행(`developer-diagnostics`) 뒤에 있다(개발 환경 전용 — 배포 빌드에는 행도 화면도 없다).
# 실기기 자동 테스트 — 개발자 탭 입력 프롬프트 미리보기 (022)
#
# ─────────────────────────────────────────────────────────────────────────────
# **개발자가 프롬프트를 줄이려면 지금 조립되는 최종 문자열을 봐야 한다.**
#
# 검증 항목 (quickstart.md D1~D3):
#   FR-005  개발자 탭에서 캐릭터별 프롬프트 원본이 보인다              (D1)
#   FR-007  "신호 없음" / "사진 있음" 두 프리셋이 렌더된다             (D2)
#   FR-011  근사 크기가 "실측 토큰 아님" 라벨과 함께 보인다            (D3)
#
# **여기서 자동화하지 않는 것** — quickstart.md D4~D6:
#   D4 스크롤·복사        — 긴 텍스트 스크롤·길게눌러 선택. 사람이 확인한다.
#   D5 사용자 화면 무노출  — 일기 목록·상세·쓰기·설정·온보딩 훑기. 사람이 확인한다.
#   D6 prod 게이트        — prod 빌드에 개발자 탭 자체가 없음. 사람이 확인한다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# ⚠️ 부분 문자열은 정규식으로 준다(007 실측). ⚠️ `childOf`를 쓰지 않는다(008 실측).
# ⚠️ 진단 화면은 local·dev 전용이다 — prod 빌드에서는 이 흐름 자체가 돌지 않는다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

# 059 — 설정 → 개발자 → 진단. 개발 환경은 「개발자」 행이 처음부터 있다(7번 탭 불필요).
- tapOn:
    id: "home-settings"
- scrollUntilVisible:
    element:
      id: "settings-developer"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-developer"
- tapOn:
    id: "developer-diagnostics"

# ★ D1 — 「입력 프롬프트 미리보기」 묶음이 있다.
#    ⚠️ 화면이 길어 각 요소마다 스크롤한다. `scrollUntilVisible`이 화면에 올린다.
- scrollUntilVisible:
    element:
      id: "diagnostics-group-prompt"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "프리셋 1 · 신호 없음"
    direction: DOWN
    timeout: 20000

# ★ D1 — 첫 프리셋(신호 없음)이 기본이다. 프롬프트 원본에 화자 규칙이 들어 있다 — buildPrompt()가 실제로 불렸다는 증거.
#    036 — 한국어 캐릭터는 E2SN 머리. 첫 줄이 "너는 '금동이'이라 불린다. 주인의 휴대폰이다. ..."이고, E2_RULES가
#    "본 것으로 주인의 하루를 짐작하는 글"을 말한다.
- assertVisible:
    text: ".*주인의 휴대폰이다.*"
- assertVisible:
    text: ".*본 것으로 주인의 하루를 짐작하는 글이다.*"

# ★ D3 — 근사 크기가 "실측 토큰 아님" 라벨과 함께 보인다(원칙 IV).
- assertVisible:
    text: ".*조립 시점 근사치, 실측 토큰 아님.*"

# ★ D2 — 「프리셋 2 · 사진 있음」을 누르면 사진 문장이 들어간 다른 프롬프트가 보인다.
- scrollUntilVisible:
    element:
      id: "diagnostics-preset-photos"
    direction: UP
    timeout: 20000
- tapOn:
    id: "diagnostics-preset-photos"
# 036 — 한국어 캐릭터(quiet)는 E2SN 문장형 신호를 쓴다: "사진은 두 장이 남았다."
- assertVisible:
    text: ".*사진은 두 장이 남았다.*"
# 출력 언어 줄 — 캐릭터 칩이 없어도(로스터 하나) 그 캐릭터의 출력 언어 줄이 나온다.
- assertVisible:
    text: ".*한국어로 써라.*"
