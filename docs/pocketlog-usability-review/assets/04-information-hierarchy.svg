<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="600" viewBox="0 0 1250 600" role="img"><style>text{font-family:'NanumSquare','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif;}.sub{font-size:17px;fill:#67605C}.label{font-size:18px;font-weight:700;fill:#39312E}</style><rect width="1250" height="600" fill="#FFFFFF"/><text x="40" y="52" font-size="30" fill="#39312E" font-weight="700" >INFORMATION HIERARCHY / DIARY READING</text><text x="40" y="82" font-size="18" fill="#625753" font-weight="400" >권장 구조: 날짜는 색인, 사진과 이야기는 본문, 반려동물은 화자입니다.</text><rect x="45" y="117" width="493" height="430" rx="18" fill="#FFF8F0" stroke="#D8CCC5"/><text x="69" y="151" font-size="17" fill="#B94B3A" font-weight="700" >2026년 10월</text><text x="68" y="237" font-size="79" fill="#39312E" font-weight="700" >12</text><text x="185" y="208" font-size="19" fill="#39312E" font-weight="700" >월요일</text><text x="185" y="237" font-size="20" fill="#39312E" font-weight="700" >햇살이 좋았던 하루</text><rect x="67" y="260" width="448" height="2" rx="0" fill="#A79A92"/><text x="70" y="299" font-size="20" fill="#625753" font-weight="400" >11     12     13     14     15     16     17</text><rect x="68" y="321" width="446" height="104" rx="8" fill="#B8C8AF"/><text x="88" y="381" font-size="22" fill="#39312E" font-weight="700" >PHOTO  ·  CONTENT FIRST</text><text x="72" y="462" font-size="21" fill="#39312E" font-weight="400" >오늘 너의 사진을 보며 생각했어.</text><text x="72" y="496" font-size="19" fill="#625753" font-weight="400" >넓은 잔디를 보니 나도 달리고 싶어.</text><g transform="translate(93,525) scale(0.22)"><path d="M-42 -22 Q-62 -75 -79 -46 Q-85 -1 -48 14" fill="#D98176" stroke="#39312E" stroke-width="5"/><path d="M42 -22 Q62 -75 79 -46 Q85 -1 48 14" fill="#D98176" stroke="#39312E" stroke-width="5"/><ellipse cx="0" cy="4" rx="51" ry="48" fill="#FFF8F0" stroke="#39312E" stroke-width="5"/><circle cx="-18" cy="0" r="4.5" fill="#39312E"/><circle cx="18" cy="0" r="4.5" fill="#39312E"/><path d="M-7 17 Q0 23 7 17" stroke="#39312E" fill="none" stroke-width="3.5" stroke-linecap="round"/><path d="M-5 12 L0 8 L5 12 Z" fill="#D98176"/></g><text x="133" y="535" font-size="16" fill="#9C493C" font-weight="400" >루이의 일기</text><rect x="580" y="118" width="45" height="42" rx="10" fill="#B94B3A"/><text x="590" y="146" font-size="18" fill="#FFFFFF" font-weight="700" >01</text><text x="648" y="140" font-size="21" fill="#39312E" font-weight="700" >날짜는 인덱스</text><text x="648" y="169" font-size="16" fill="#625753" font-weight="400" >상단에 위치하되 콘텐츠를 압도하지 않게 조정</text><rect x="580" y="200" width="45" height="42" rx="10" fill="#B94B3A"/><text x="590" y="228" font-size="18" fill="#FFFFFF" font-weight="700" >02</text><text x="648" y="222" font-size="21" fill="#39312E" font-weight="700" >주간 탐색</text><text x="648" y="251" font-size="16" fill="#625753" font-weight="400" >오늘·선택·작성 여부를 독립된 시각 정보로 구별</text><rect x="580" y="282" width="45" height="42" rx="10" fill="#B94B3A"/><text x="590" y="310" font-size="18" fill="#FFFFFF" font-weight="700" >03</text><text x="648" y="304" font-size="21" fill="#39312E" font-weight="700" >사진과 본문</text><text x="648" y="333" font-size="16" fill="#625753" font-weight="400" >원본 콘텐츠가 화면의 주인공</text><rect x="580" y="364" width="45" height="42" rx="10" fill="#B94B3A"/><text x="590" y="392" font-size="18" fill="#FFFFFF" font-weight="700" >04</text><text x="648" y="386" font-size="21" fill="#39312E" font-weight="700" >캐릭터 서명</text><text x="648" y="415" font-size="16" fill="#625753" font-weight="400" >읽기에서는 작은 비중만 사용</text><rect x="580" y="446" width="45" height="42" rx="10" fill="#B94B3A"/><text x="590" y="474" font-size="18" fill="#FFFFFF" font-weight="700" >05</text><text x="648" y="468" font-size="21" fill="#39312E" font-weight="700" >주요 동작</text><text x="648" y="497" font-size="16" fill="#625753" font-weight="400" >쓰기 전에는 강조, 읽기 중에는 후순위</text></svg>