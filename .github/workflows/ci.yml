name: Alpharium CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 1단계: 검사와 기기 불필요 테스트
  #
  # 실기기 테스트는 CI에서 돌지 않는다. 기기가 없으므로 건너뛴 것으로 보고되며,
  # 통과로 집계되지 않는다(FR-021e, 헌법 원칙 V).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci

      # eslint + tsc + 헌법 위반 검사(FR-026)
      - run: npm run lint

      # 기기 불필요 갈래. 기기 없이 항상 돈다(FR-021c)
      #
      # 러너는 2코어다. package.json의 --maxWorkers=50%는 개발자 기계(다중 코어)를
      # 기준으로 잡은 값이라 여기서는 워커가 1개가 되어 오히려 느려진다.
      # CI에서는 코어 수를 그대로 쓴다.
      - run: npm test -- --maxWorkers=2

      - run: npx prettier --check "src/**/*.{ts,tsx}" "__tests__/**/*.{ts,tsx}" "*.{ts,tsx}"

      # 의존성 선언과 SDK 기대값이 어긋나는지 확인(FR-022)
      #
      # **이 검사는 main을 깨뜨리지 않는다.** --check는 저장소의 상태가 아니라 Expo
      # 레지스트리의 「현재 권장값」을 보므로, 코드를 한 줄도 건드리지 않아도 upstream이
      # 패치를 내면 빨간불이 된다. 실제로 8/16(57.0.9->57.0.13)과 8/17(57.0.13->57.0.14)에
      # 같은 이유로 두 번 깨졌다.
      #
      # 헌법과 AGENTS.md가 못 박은 것은 「Expo 57」이지 패치 버전이 아니다. 어긋남은
      # 로그에 그대로 남으므로 관측은 잃지 않고, 등급만 낮춘다(원칙 V — 못 본 것을 본
      # 것으로 적지 않는다. 여기서는 본 것을 그대로 적되 차단하지 않을 뿐이다).
      - run: npx expo install --check
        continue-on-error: true

      # 실기기 테스트가 건너뛰어졌음을 결과에 남긴다.
      # 이 실행은 온디바이스를 검증하지 않았다.
      - run: npm run test:device

  # 2단계: 안드로이드 번들이 만들어지는지 확인
  #
  # 웹 빌드는 하지 않는다 — 이 제품은 안드로이드 앱이고, 웹에서는 온디바이스 추론이
  # 불가능하다(헌법 원칙 I).
  bundle:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npx expo export --platform android --output-dir dist
      - uses: actions/upload-artifact@v6
        with:
          name: android-bundle
          path: dist/
