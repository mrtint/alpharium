# 실기기 자동 테스트 — 쓰는 중 독백 (015)
#
# ─────────────────────────────────────────────────────────────────────────────
# **이 흐름이 015의 User Story 1·2를 본다.**
#
# 007은 "쓰고 있다" 한 문구만 고정으로 보였다. 015는 진행 단계(신호 확인 →
# 사진 보기 → 글쓰기)와 사진 장 전환마다 서로 다른 서술어의 독백 문구를
# 보여준다.
#
# 검증 항목:
#   FR-001   단계별로 서로 다른 독백 문구가 보인다
#   FR-003   사진을 안 보면 vision 관련 문구가 안 보인다
#   FR-004   문구에 숫자·순번이 없다                    (원칙 IV)
#   FR-009   실패 화면 전환 후 독백이 남지 않는다
#   FR-010   그만두기 후 독백이 사라진다
#   FR-013   사진 장 전환마다 문구가 갱신된다
#   FR-014   연속으로 완전히 같은 문구가 나오지 않는다
#
# **모델이 없으면 즉시 "캐릭터를 먼저 준비해야 한다"로 끝난다** — 그것이
# 정상이다. 이 흐름은 독백이 실제로 보이는 구간을 조건부로만 검사한다
# (quickstart.md A1~A5, 아래 quiet/narrative 조건 참고).
#
# ⚠️ **quiet처럼 빠른 캐릭터는 독백이 스쳐 지나가 SKIPPED가 될 수 있다.**
# 그것은 실패가 아니다 — User Story 2(빠른 생성에서도 화면이 안 깨진다)가
# 바로 이 상황을 다룬다. **루이(narrative)로 돌리면 26초 이상 머물러 눈으로
# 확인하기 쉽다**(quickstart.md, 손으로 하는 A1·A5의 근거).
#
# **여기서 자동화하지 않는 것** — quickstart.md A3·A4의 정밀 시나리오:
#   비행기 모드로 실패를 유도하는 것, 그만두는 정확한 타이밍은 Maestro로
#   재현하기 어렵다. quickstart.md A3·A4를 손으로 확인한다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
# ─────────────────────────────────────────────────────────────────────────────
appId: com.a810labs.pocketlog
---
- launchApp

- assertVisible: "일기"

# ⚠️ **017 — 스크롤해야 보인다.** 017이 사진 설정·장소명 토글을 더해
# 화면이 길어지면서, "일기 쓰기" 버튼이 첫 화면 아래로 밀렸다
# (2026-08-24 실측 — 007·009가 캐릭터·하루 목록에서 이미 겪은 것과
# 같은 종류다).
- scrollUntilVisible:
    element:
      id: "write-button"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "write-button"

# 쓰기를 눌러 본다. 모델이 없으면 즉시 「준비해야 한다」로 끝나고 그것이
# 정상이다 — 아래 조건부 블록들이 각 상황을 가른다.
# 051 — 쓴 날에는 같은 버튼이 「다시 쓰기」다(기본 선택 = 오늘). id로 누른다(FR-037a).
- tapOn:
    id: "write-button"

# ★ FR-004 — 담을 자리가 없다는 것과 별개로, 실제로 뜬 문구에도 숫자·퍼센트가
# 없다(원칙 IV). 모델이 없으면 즉시 끝나므로 어느 쪽이든 참이어야 한다.
- assertNotVisible: "%"
- assertNotVisible: "남음"
- assertNotVisible: "초 남"
- assertNotVisible: "토큰"

# ─────────────────────────────────────────────────────────────────────────────
# 여기서부터는 **실제로 쓰는 중일 때만** 참이다 — 모델이 없으면 이 블록
# 전체가 SKIPPED로 지나가고, 그것은 실패가 아니다(원칙 V, quickstart A1).
#
# ★ 039 실측(SM-S901N) — `when: visible: "쓰고 있다"`(정확한 전체 문자열)는
# **재시도 없는 1회성 체크**라 블록 전체가 SKIPPED로 지나가는 것이 실기기에서
# 실제로 관측됐다(추측이 아니라 실측 — 원칙 V). 이 블록의 진짜 조건은 "정확히 이
# 문구인가"가 아니라 "지금 쓰는 중인가"이므로 쓰는 중에만 있는 하단의 검정 「그만두기」
# 바(`stop-button`)로 조건을 건다.
#
# ★ 054 — 쓰는 중이 홈 안의 상태가 됐고 독백은 **글자 단위 타자기가 아니라 몇 초마다 페이드로 교체**된다.
# 「쓰는 중」은 헤더 상태 줄과 머리말에도 있으므로 글자가 아니라 `stop-button`으로 가른다.
# ─────────────────────────────────────────────────────────────────────────────
- runFlow:
    when:
      visible:
        id: "stop-button"
    commands:
      # A1 — 단계가 바뀌면 "쓰고 있다"가 아닌 독백 문구로 바뀐다. 넉넉히
      # 기다려 신호가 최소 한 번은 오게 한다(캐릭터가 빠르면 여기서 이미
      # 다음 단계로 넘어가 있을 수 있다 — 그래도 "쓰고 있다"만 계속 보이는
      # 것은 FR-001 위반이 아니라 User Story 2가 다루는 정상 범위다).
      - extendedWaitUntil:
          notVisible: "쓰고 있다"
          timeout: 5000

      # FR-013·014 — 사진 장 전환에서 문구가 계속 갱신된다. "사진을 들여다
      # 보는 중…" 계열이 뜨면(vision 신호가 왔다는 뜻) 잠시 후 다시 살펴
      # 같은 문구가 그대로 굳어 있지 않은지 본다(완전한 동일성 검사는 화면
      # 텍스트가 연속으로 캡처돼야 하므로 여기서는 정지 여부만 본다).
      - runFlow:
          when:
            visible: ".*(사진을 들여다보는|장을 살펴보는|눈에 담는).*"
          commands:
            - assertVisible:
                text: ".*(사진을 들여다보는|장을 살펴보는|눈에 담는).*"

      # ★ FR-013 — 순번이 문구에 없다("첫 번째"·"두 번째"·숫자).
      - assertNotVisible: "첫 번째"
      - assertNotVisible: "두 번째"
      - assertNotVisible: "세 번째"

      # 어떻게 끝나든 쓰는 중 표식(`stop-button`)과 독백 문구가 남아 있지 않다.
      - extendedWaitUntil:
          notVisible:
            id: "stop-button"
          timeout: 240000

      # FR-009 — 완료/실패 화면 전환 뒤 독백 문구가 남아있지 않다.
      - assertNotVisible: ".*(들여다보는|살펴보는|눈에 담는|기록을 확인하는|되짚어보는|헤아리는|문장으로 옮기는|적어보는).*"

# ★ 원칙 III — 실패가 「할 수 있는 것」으로 옮겨진다(006 S8 유지).
- assertNotVisible: "되뱉"
- assertNotVisible: "rejected"
- assertNotVisible: "unfinished"
