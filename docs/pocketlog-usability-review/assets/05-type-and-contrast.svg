<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="570" viewBox="0 0 1270 570" role="img"><style>text{font-family:'NanumSquare','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif;}.sub{font-size:17px;fill:#67605C}.label{font-size:18px;font-weight:700;fill:#39312E}</style><rect width="1270" height="570" fill="#FFFFFF"/><text x="42" y="54" font-size="30" fill="#39312E" font-weight="700" >TYPE + ACCESSIBILITY</text><text x="42" y="86" font-size="17" fill="#625753" font-weight="400" >긴 본문은 읽기 쉬운 고딕, 캐릭터의 짧은 표현에 한해 손글씨를 검토합니다.</text><rect x="34" y="111" width="581" height="407" rx="16" fill="#FFF8F0" stroke="#E2DAD6"/><text x="59" y="156" font-size="17" fill="#B94B3A" font-weight="700" >2026년 10월</text><text x="56" y="257" font-size="86" fill="#39312E" font-weight="700" >12</text><text x="212" y="216" font-size="24" fill="#39312E" font-weight="700" >월요일</text><text x="212" y="252" font-size="24" fill="#39312E" font-weight="700" >루이가 남긴 작은 이야기</text><rect x="58" y="280" width="533" height="2" rx="0" fill="#D5C7BD"/><text x="59" y="327" font-size="22" fill="#39312E" font-weight="400" >오늘 너의 사진을 보면서</text><text x="59" y="364" font-size="22" fill="#39312E" font-weight="400" >무슨 하루였을까 생각했어.</text><text x="59" y="434" font-size="32" fill="#9C493C" font-weight="400" font-style="italic">— 루이</text><text x="59" y="488" font-size="16" fill="#625753" font-weight="400" >손글씨 후보는 서명·독백에 한정</text><rect x="648" y="113" width="580" height="406" rx="16" fill="#F8F4F4" stroke="#E2DAD6"/><rect x="668" y="145" width="148" height="54" rx="9" fill="#EC3013"/><text x="686" y="179" font-size="23" fill="#F3F2F2" font-weight="700" >Aa / 12</text><text x="840" y="167" font-size="18" fill="#39312E" font-weight="700" >CURRENT</text><text x="840" y="194" font-size="15" fill="#625753" font-weight="400" >3.76:1 · 작은 흰 글자 미달</text><rect x="668" y="230" width="148" height="54" rx="9" fill="#B94B3A"/><text x="686" y="264" font-size="23" fill="#FFF8F0" font-weight="700" >Aa / 12</text><text x="840" y="252" font-size="18" fill="#39312E" font-weight="700" >WARM ACTION</text><text x="840" y="279" font-size="15" fill="#625753" font-weight="400" >4.83:1 · 일반 글자 AA</text><rect x="668" y="315" width="148" height="54" rx="9" fill="#D98176"/><text x="686" y="349" font-size="23" fill="#FFF8F0" font-weight="700" >Aa / 12</text><text x="840" y="337" font-size="18" fill="#39312E" font-weight="700" >SOFT CORAL</text><text x="840" y="364" font-size="15" fill="#625753" font-weight="400" >2.71:1 · 밝은 글자 금지</text><rect x="668" y="400" width="148" height="54" rx="9" fill="#39312E"/><text x="686" y="434" font-size="23" fill="#FFF8F0" font-weight="700" >Aa / 12</text><text x="840" y="422" font-size="18" fill="#39312E" font-weight="700" >MAIN BODY</text><text x="840" y="449" font-size="15" fill="#625753" font-weight="400" >12.06:1 · 고대비</text><text x="43" y="557" font-size="16" fill="#625753" font-weight="400" >수치는 WCAG 상대휘도 공식 기반 근사치입니다. 실제 컴포넌트별 글자 크기와 굵기까지 함께 검수하세요.</text></svg>