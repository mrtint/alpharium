# 실기기 자동 테스트 — 025 일기 본문 사진 슬라이더 & 풀스크린 갤러리
#
# ─────────────────────────────────────────────────────────────────────────────
# **User Story 1(슬라이더)·2(갤러리)가 화면에 실제로 배선됐는지 본다.**
# 사진이 여러 장 있는 저장된 일기(생성은 사람이 quickstart.md §2에서 한다)를
# 열어 확인한다.
#
# 검증 항목:
#   FR-001·FR-002  사진이 있는 일기를 열면 가로 슬라이더 + 위치 표시가 보인다  (M1)
#   FR-008·FR-009  슬라이더의 사진을 탭하면 풀스크린 갤러리가 그 순번에서 열린다 (M2)
#   FR-012         갤러리에도 위치 표시가 있다                                (M2)
#   FR-013         닫기 버튼으로 갤러리가 닫히고 상세 화면으로 돌아온다        (M2)
#   FR-018         화면에 모델 식별자·좌표·수치가 없다                        (M3)
#
# ─────────────────────────────────────────────────────────────────────────────
# **★ 여기서 자동화하지 않는 것 — quickstart.md §2:**
#
#   가로 스와이프로 위치 표시가 "2 / N"으로 갱신           — Maestro의 swipe가
#                                                          pagingEnabled 스냅과
#                                                          맞물리는지 기기마다
#                                                          달라 사람이 확인한다.
#   갤러리 좌우 스와이프·끝에서 멈춤(순환 없음)            — 위와 같은 이유.
#   회전/백그라운드 시 갤러리 유지(FR-015a)               — 기기 회전·홈 복귀
#                                                          조작이 필요하다.
#   집합 일치(슬라이더 == 갤러리, SC-003)                 — 장수를 눈으로 대조.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# 선행: 사진 2장 이상 있는 하루의 일기가 저장돼 있어야 한다. 없으면
#        `npm run seed:day -- many-camera <날짜>` 로 심고 「빠르게 봄」으로
#        생성한다(quickstart.md §2). 검증용 합성 하루는 "경로가 도는가"만
#        본다 — 품질 결론에 쓰지 않는다(010 원칙).
#
# ⚠️ 부분 문자열은 정규식으로 준다(007 실측). ⚠️ `childOf`를 쓰지 않는다
# (008 실측) — `testID`를 따로 준다. ⚠️ 패널이 길면 `scrollUntilVisible`로
# 올린다(022 실측).
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

- assertVisible: "일기"

# ★ M1·M2 — **사진이 여러 장 있는 저장된 일기를 열면 슬라이더가, 탭하면
#   갤러리가 뜬다**(FR-001·002·008·009·012·013).
#
# "사진 N장"(N>=2)이 붙은 줄이 있으면 그것을 열어 확인한다. 없으면(이 기기에
# 아직 사진 여러 장인 일기가 저장되지 않았으면) 이 블록은 SKIPPED로 지나간다 —
# quickstart.md §2가 사람 확인으로 이 갈래를 메운다.
- runFlow:
    when:
      visible:
        text: "사진 [2-9][0-9]*장"
    commands:
      - tapOn:
          text: "사진 [2-9][0-9]*장"

      # ★ M1 — 슬라이더 페이저와 위치 표시가 보인다(FR-001·002).
      - scrollUntilVisible:
          element:
            id: "photo-slider-pager"
          direction: DOWN
          timeout: 20000
      - assertVisible:
          id: "photo-slider-pager"
      - assertVisible:
          id: "photo-slider-position"

      # ★ M2 — 슬라이더의 첫 사진을 탭하면 풀스크린 갤러리가 열린다(FR-008·009).
      - tapOn:
          id: "photo-slider-cell-0"
      - assertVisible:
          id: "photo-gallery"
      # ★ FR-012 — 갤러리에도 위치 표시가 있다.
      - assertVisible:
          id: "photo-gallery-position"

      # ★ FR-013 — 닫기 버튼으로 갤러리가 닫히고 상세 화면으로 돌아온다.
      - tapOn:
          id: "photo-gallery-close"
      - assertNotVisible:
          id: "photo-gallery"
      # 상세 화면으로 돌아왔다.
      - assertVisible:
          id: "photo-slider-pager"

      - scrollUntilVisible:
          element:
            text: "← 목록"
          direction: UP
          timeout: 20000
      - tapOn: "← 목록"

# ★ M3 — 원칙 III·IV — 좌표·수치·모델 정보가 화면에 없다(FR-018).
- assertNotVisible: "gguf"
- assertNotVisible: "GGUF"
- assertNotVisible: "latitude"
- assertNotVisible: "tokens_predicted"
