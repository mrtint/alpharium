# 실기기 자동 테스트 — 사진의 내용을 보고 일기의 재료로 준다 (011 → 029로 설정 탭 이동)
#
# ─────────────────────────────────────────────────────────────────────────────
# **004가 사진의 장수와 좌표만 세던 것을, 사진 보는 모델이 한 장씩 읽어 일기의
# 재료로 준다.** 005 이후 처음으로 휴대폰이 눈을 뜬다.
#
# ⚠️ **2026-09-02 갱신(029)** — 011의 `VisionPicker`가 홈에서 사라지고 설정 탭
# "사진 보기" 섹션으로 옮겨졌다(FR-024). 상태가 3개(none/quick/detailed)에서
# **4개(auto/none/quick/detailed, 기본 "자동")**로 늘었다. 사진 보는 모델의
# 준비 관리(`vision-row`)도 "캐릭터" 탭이 사라져 설정 탭 아래쪽으로 흡수됐다.
#
# 검증 항목:
#   011 FR-015   사진 설정 넷이 보이고 고를 수 있다        (M1·M2)
#   011 FR-016   시각 인코더를 고르게 하지 않는다          (M3, 원칙 III)
#   029 FR-024   기본이 "자동"이다                         (M1)
#   011 FR-019a  무엇이 다른지 읽을 수 있다               (M1)
#   011 FR-020   오래 걸린다는 것을 고르기 전에 알린다     (M1)
#   011 FR-026   준비 상태가 하나의 값으로 보인다          (M4)
#   011 FR-031a  사진 보는 모델의 이름이 없다             (M4, 원칙 III)
#
# ─────────────────────────────────────────────────────────────────────────────
# **★ 여기서 자동화하지 않는 것 — quickstart.md D1~D8 (011) + Q4 (029):**
#
#   D2  사진을 실제로 보았는가   — **이 기능의 핵심 검증이며 사람이 한다.**
#                                  같은 하루를 「보지 않음」과 「빠르게 봄」으로 각각
#                                  써서 **전문을 견주어야** 한다.
#   D3  VLM→캐릭터 모델 전환      — `narrative`(2.4B)로 해야 한다.
#   029 Q4  설정 고정값이 자동 판정을 덮어쓴다 — "보지 않음" 고정 후 사진 있는 날에
#                                  생성 → 캡션이 안 도는지. 실제 생성이 필요하다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️ **`childOf`를 쓰지 않는다**(008 실측). ⚠️ 부분 문자열은 정규식으로 준다(007 실측).
appId: com.anonymous.alpharium
---
- launchApp

# 일기 탭이 첫 화면이다(006 FR-009 유지).
- assertVisible: "일기"

# ★ 029 FR-001 — **홈에 사진 설정 선택기가 없다.**
- assertNotVisible: "사진을 보지 않음"
- assertNotVisible: "빠르게 봄"
- assertNotVisible: "자세히 봄"

# ── 설정 탭 "사진 보기" 섹션으로 간다 ───────────────────────────────────
- tapOn: "설정"

# ★ M1 / 011 FR-015 + 029 FR-024 — **사진 설정 넷이 보인다.**
# 자동/보지 않음/빠르게 봄/자세히 봄. 각각 testID로 짚는다(vision-<setting>).
- scrollUntilVisible:
    element:
      id: "vision-auto"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "vision-auto"

- scrollUntilVisible:
    element:
      id: "vision-none"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "vision-none"

- scrollUntilVisible:
    element:
      id: "vision-quick"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "vision-quick"

- scrollUntilVisible:
    element:
      id: "vision-detailed"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "vision-detailed"

# ★ 029 FR-024 — **기본이 "자동"이다.** (파일이 없으면 "자동"으로 로드된다.)
#   이전 흐름에서 다른 값을 고르고 안 되돌렸으면 이 assert가 틀릴 수 있어,
#   흐름 끝에서 "자동"으로 되돌린다(아래).
- assertVisible:
    text: ".*그날 사진이 있으면.*없으면.*"

# ★ 011 FR-019a — **무엇이 다른지 읽을 수 있다.**
# 설명이 「결과의 차이」로 쓰였는지 본다 — 「256토큰」이 아니라 「무엇이 달라지는가」다.
- assertVisible:
    text: ".*무엇이 담겼는지.*"

# ★ 011 FR-020 — **오래 걸린다는 것을 고르기 전에 알린다**(원칙 III).
- assertVisible:
    text: ".*오래 걸린다.*"

# ★ M3 / 011 FR-016 — **시각 인코더를 고르게 하지 않는다**(헌법 MUST NOT).
- assertNotVisible: "LFM"
- assertNotVisible: "SmolVLM"
- assertNotVisible: "mmproj"
- assertNotVisible: "gguf"
- assertNotVisible: "Q8"

# ★ 원칙 IV — 토큰 수·배수·초가 없다.
- assertNotVisible: "토큰"
- assertNotVisible: "256"
- assertNotVisible: "1024"

# ★ M2 / 011 FR-015 — **고를 수 있고 고른 것이 표시된다.**
- tapOn:
    id: "vision-quick"
- assertVisible: "선택"

- tapOn:
    id: "vision-detailed"
- assertVisible: "선택"

# ★ M4 / 011 FR-026·031a — **사진 보는 모델의 준비 줄이 설정 탭에 있다.**
# "캐릭터" 탭이 사라져 설정 탭 아래쪽으로 흡수됐다(029, ModelSection).
- scrollUntilVisible:
    element:
      id: "vision-row"
    direction: DOWN
    timeout: 20000
- assertVisible: "사진을 보는 데 필요한 것"
- assertNotVisible: "mmproj"
- assertNotVisible: "본체"
- assertNotVisible: "파일 2"

# ★ 011 FR-031a — 모델 이름·파일명·크기가 없다(원칙 III).
- assertNotVisible: "LFM"
- assertNotVisible: "SmolVLM"
- assertNotVisible: "Liquid"
- assertNotVisible: "gguf"

# ★ 원칙 IV — 남은 시간·속도가 없다.
- assertNotVisible: "초 남"
- assertNotVisible: "/s"

# ★ 029 — 이 흐름이 기기 상태를 바꾼 채 끝나지 않게 "자동"으로 되돌린다.
- scrollUntilVisible:
    element:
      id: "vision-auto"
    direction: UP
    timeout: 20000
- tapOn:
    id: "vision-auto"
