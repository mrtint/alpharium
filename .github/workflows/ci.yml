name: Alpharium Mobile CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Stage: Test (Push 및 PR/MR 발생 시 즉시 실행, 실패 시 이후 모든 단계 취소)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx prettier --check "src/**/*.{ts,tsx}" "App.tsx"

  # 2. Stage: Build (Test 단계 100% 통과 시에만 실행, 실패 시 중단)
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

  # 3. Stage: Release (Build 통과 및 main 브랜치인 경우에만 실행)
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "Verifying Release Version..."
      - run: node -e "console.log('Release Version:', require('./package.json').version)"

  # 4. Stage: Deploy (Release 성공 시에만 최종 배포)
  deploy:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/
      - run: echo "Deploying build artifacts..."
      - run: ls -la dist/
