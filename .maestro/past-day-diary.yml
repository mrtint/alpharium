# 실기기 자동 테스트 — 지난 하루를 골라 쓴다 (009 → 049)
#
# ─────────────────────────────────────────────────────────────────────────────
# **006이 박아 둔 「어제 하나」를 사용자가 고를 수 있게 됐는지 본다.**
#
# 그 전까지 쓰기 자리에는 「2026-08-20를 쓴다」가 고정으로 있었고 바꿀 길이 없었다 —
# **하루를 놓치면 영영 못 썼다.**
#
# **049 — 사흘이 아니라 지난 날 전부다.** 스트립을 오른쪽으로 넘겨 이전 주로 간다.
#
# 검증 항목:
#   FR-001   고르는 자리(주간 스트립)가 보인다    (M1)
#   049 SC-001  넘겨서 사흘 밖(4주 전)에 닿는다   (M5)
#   FR-006   하루를 골라 쓸 수 있다               (M2)
#   FR-007   하나가 골라져 있다
#   FR-011   일기가 있는 하루에 표시가 있다       (M4)
#   FR-011a  고르는 자리에 사진 갈래가 없다       (원칙 V — 알 수 없다)
#   FR-018   생성 중에 지표가 없다                (원칙 IV)
#   FR-020   고르는 자리에 모델 정보가 없다       (원칙 III)
#
# **여기서 자동화하지 않는 것** — quickstart.md B2·B3:
#   고른 하루의 날짜로 저장되는가   — 생성이 실제로 끝나야 하고 캐릭터·모델이 필요하다.
#                                     **SC-013은 완료 조건이므로 사람이 확인한다**
#   (049 — 되돌림(009 FR-009)은 사라졌다. 지난 날을 모두 고를 수 있어 밀려날 곳이 없다.)
#   release에서 도는가              — 빌드가 12~31분이다. 사람이 확인한다
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# ⚠️ **`childOf`를 쓰지 않는다**(008 실측). RN 화면은 접근성 트리가 평탄화되어 줄 안의
# 글자가 **형제**로 나온다 — 그래서 하루마다 `testID`를 따로 준다. `testID`는
# release(R8·ProGuard)에서 살아남는 것이 008에서 확인됐다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

# 일기 탭이 첫 화면이다(006 FR-009 유지).
- assertVisible: "일기"

# ★ M1 / FR-001 — **고르는 자리가 있다.**
#
# 048 — 고르는 자리가 홈 위쪽의 7칸 스트립(`day-strip`)이 됐다. 첫 화면에 바로 보인다.
- assertVisible:
    id: "day-strip"

# ★ FR-007·008 — **하나가 골라져 있고 무엇을 쓰게 되는지 보인다.**
#
# **부분 문자열은 정규식으로 준다**(007 실측). Maestro의 기본 매칭이 텍스트 노드
# 전체와 맞춰 보므로 「2026-08-20를 쓴다」를 부분으로 찾으면 실패한다.
#
# 048 — 「N를 쓴다」가 하단 고정 바의 「n일」(`write-day-label`)이 됐고, 골라진 칸은
# 스트립에서 selected 상태로 표시된다(「선택」 글자는 없다).
# 051 — 쓴 날의 하단 바(「다시 쓰기」)에는 날짜 조각이 없다. 쓰게 될 하루는 헤더의 큰 날짜가 보인다.
- assertVisible:
    id: "home-day-number"
- assertVisible:
    id: "day-.*"
    selected: true

# ★ FR-020 — 고르는 자리가 늘어도 모델 정보가 없다(원칙 III).
- assertNotVisible: "kanana"
- assertNotVisible: "exaone"
- assertNotVisible: "hyperclova"
- assertNotVisible: "gguf"
- assertNotVisible: "Q4"
- assertNotVisible: "파라미터"

# ★ FR-011a — **고르는 자리에 사진 갈래가 없다**(원칙 V).
#
# ⚠️ 여기서 `assertNotVisible: "사진"`을 쓸 수 없다 — **목록의 줄에는 사진 갈래가
# 계속 보이고**(007 FR-018) dev 빌드에는 진단 패널의 「사진 접근」도 있다. 둘 다
# 정상이며, 검사해야 하는 것은 **고르는 자리 안**이다.
#
# 그래서 **그 자리에만 있는 문구**로 본다 — 「사진 모름」이 세 줄 그려졌다면 그것은
# 아직 쓰지 않은 하루의 값을 지어낸 것이다.
- assertNotVisible: "사진 모름사진 모름"

# ★ M5 / 049 SC-001 — **넘겨서 사흘 밖에 닿는다.** 오른쪽으로 네 번 넘기면 4주 전이다.
# 날짜를 적지 않는다(기기의 오늘에 달렸다) — 넘길 때마다 골라진 칸이 남아 있고, 오늘 밑줄
# (`day-today-*`)은 오늘이 든 주에만 있으므로 넘긴 뒤에는 보이지 않아야 한다.
- swipe:
    from:
      id: "day-strip"
    direction: RIGHT
- swipe:
    from:
      id: "day-strip"
    direction: RIGHT
- swipe:
    from:
      id: "day-strip"
    direction: RIGHT
- swipe:
    from:
      id: "day-strip"
    direction: RIGHT
- assertNotVisible:
    id: "day-today-.*"
- assertVisible:
    id: "day-.*"
    selected: true
# 051 — 쓴 날의 하단 바(「다시 쓰기」)에는 날짜 조각이 없다. 쓰게 될 하루는 헤더의 큰 날짜가 보인다.
- assertVisible:
    id: "home-day-number"
# 4주 전 주에는 흐린(미래) 칸이 없다 — 어느 칸이든 누를 수 있다.
- tapOn:
    id: "day-.*"
    selected: false
    enabled: true
- assertVisible:
    id: "day-.*"
    selected: true

# ★ M2 / FR-006 — **어제가 아닌 하루를 고른다.**
#
# 화면이 어느 날짜를 보여줄지는 기기의 오늘에 달렸으므로 **날짜를 적지 않는다.**
# 대신 「선택」이 붙지 않은 자리를 누른다 — 그것이 곧 어제가 아닌 하루다.
#
# ⚠️ `testID`로 찾으려면 날짜를 알아야 하므로 여기서는 쓰지 않는다. 사람이 하는
# 확인(quickstart D3)이 `testID`를 쓴다.
#
# ⚠️ **017 — 여기서 "언제를 쓸까" 타이틀을 다시 확인하지 않는다.** 화면이
# 길어지며 위쪽으로 스크롤해야 다시 보이는 위치까지 내려왔다 — 바로 위의
# "N를 쓴다"·"선택" 확인이 이미 같은 화면(고르는 자리)에 있음을 증명한다.

# 쓰기를 눌러 본다.
#
# **모델이 없으면 「캐릭터를 먼저 준비해야 한다」로 끝나고 그것이 정상이다**(FR-006).
- scrollUntilVisible:
    element:
      id: "write-button"
    direction: DOWN
    timeout: 20000
# 051 — 쓴 날에는 같은 버튼이 「다시 쓰기」다(기본 선택 = 오늘). id로 누른다(FR-037a).
- tapOn:
    id: "write-button"

# ★ FR-018 — **생성 중에 아무것도 늘지 않았다**(원칙 IV).
#
# 누른 직후에 본다. 모델이 없으면 즉시 끝나므로 어느 쪽이든 참이어야 한다.
#
# ⚠️ 생성이 2.4~2.6초라 「쓰고 있다」를 못 볼 수 있다(007 실측). **건너뛴 것은 통과가
# 아니므로** 그때는 quickstart D9를 손으로 확인한다.
- assertNotVisible: "%"
- assertNotVisible: "남음"
- assertNotVisible: "토큰"
- assertNotVisible: "살펴보는"
- assertNotVisible: "단계"

# ★ 고르는 자리가 생성 뒤에도 살아 있다 — 다시 고를 수 있어야 갇히지 않는다.
#
# **누른 뒤에 갈 수 있는 자리가 넷이다**(전부 정상이며 어느 쪽이든 목록으로 돌아온다):
#   0. 덮어쓰기 확인(「취소」/「확인」) — 012, 고른 하루에 이미 일기가 있다 → 취소
#   1. 쓰는 중        — 모델이 있고 생성 중이다(054 — 홈 안의 상태, 하단의 검정 「그만두기」 바) → 그만두기
#   2. 「캐릭터를 먼저 준비해야 한다」 — 모델이 없다(FR-006) → 목록으로
#   3. 홈의 그 날       — 생성이 이미 끝났다(2.4초일 수 있다). 051부터 결과 화면 없이 홈으로 돌아온다
#
# ⚠️ **모델이 없는 기기에서 2번으로 가는 것을 잊으면 흐름이 실패한다** — 그 화면에는
# 고르는 자리가 없으므로 아래의 `scrollUntilVisible`이 영영 못 찾는다. 제품의 결함이
# 아니라 흐름의 결함이다.
#
# ⚠️ **012 이후 0번(덮어쓰기 확인)이 추가됐는데 이 흐름이 놓치고 있었다**
# (2026-08-24 017 실기기 확인에서 실제로 걸림 — 고른 하루에 이미 일기가
# 있으면 확인 화면이 뜨고, 처리하지 않으면 뒤 단계가 전부 어긋난다).
- runFlow:
    when:
      visible: "취소"
    commands:
      - tapOn: "취소"

- runFlow:
    when:
      visible:
        id: "stop-button"
    commands:
      - tapOn:
          id: "stop-button"

# 홈이 아니면 돌아간다. 054 — 「그만두기」·실패는 쓰기 전 상태의 홈으로 돌아온다(실패는 토스트). 「← 일기」가
# 있으면 쓰기 **시작 전** 막힘 화면(캐릭터 미준비)이다.
- runFlow:
    when:
      visible: "← 일기"
    commands:
      - tapOn: "← 일기"

# 뒤로 가기로도 돌아갈 수 있다 — 위 둘 다 아니었을 때의 마지막 통로다(048 — 탭 줄이 없다).
- runFlow:
    when:
      notVisible:
        id: "day-strip"
    commands:
      - back

- assertVisible:
    id: "day-strip"
