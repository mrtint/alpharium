# 시스템 뒤로 가기 — 안드로이드는 하드웨어 뒤로 키, iOS는 뒤로 키가 없어 같은 의도를 화면의 요소로 누른다 (097).
#
# 다른 흐름이 부르는 보조 흐름이다 — 최상위로 돌리지 않는다(FLOWS에 없다). 호출:
#   - runFlow:
#       file: _system-back.yml
#       env:
#         IOS_TAP_ID: "back-to-home"   # iOS에서 대신 누를 요소의 id (닫기·취소·「‹」)
# 안드로이드 동작은 종전의 `- back`과 같다.
appId: com.a810labs.pocketlog
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: ${IOS_TAP_ID}
