# 055 — 설정 진입은 `home-settings`(홈 월 라벨 줄 오른쪽 점 세 개). 설정에 캐릭터 목록·권한 안내 다시 보기가 없다 —
#       그 단계에 기대면 폐기 후보(대체 경로는 개발자 메뉴 조각). FLOWS 밖이다.
# 실기기 자동 테스트 — 일기 본문 화면 개선 (017)
#
# ─────────────────────────────────────────────────────────────────────────────
# **User Story 1~4가 화면에 실제로 배선됐는지 본다.** 사진·제목·소요 시간은
# 이미 저장된 일기(생성은 사람이 quickstart.md D2~D6에서 한다)를 열어
# 확인하고, 장소명은 목록 화면의 토글 렌더링·고지 문구·선택 표식을 본다.
#
# 검증 항목 (051 — 홈이 곧 상세가 되며 M1·M2를 다시 썼다):
#   051 US1  쓴 날을 누르면 홈 지면에 본문·사진이 보인다               (M1)
#   051 FR-016a 지면에 「이 일기가 본 것」·소요 시간이 없다 (017 M2를 뒤집음) (M1)
#   FR-004~006 장소명 설정이 켤 때 고지가 뜬다 (029: 설정 탭 "장소명" 섹션)  (M3)
#
# ─────────────────────────────────────────────────────────────────────────────
# **★ 여기서 자동화하지 않는 것 — quickstart.md D1~D6:**
#
#   D1  reverseGeocodeAsync의 권한 요구 사실   — 손으로 확인(완료, research.md §3
#                                                실측 반영됨).
#   D2  사진 표시(원본 삭제 후에도 유지)        — 갤러리 앱에서 원본을 지우는
#                                                조작이 필요해 Maestro로 재현하기
#                                                어렵다. 사람이 확인한다.
#   D3a 제목 헤드라인 사람 검수                — 자동 채점 없이 여러 하루의
#                                                제목을 나란히 읽는 절차라 애초에
#                                                자동화 대상이 아니다(TL8).
#   D4  콜드 스타트 체감 시간·진행 중 미노출    — 실제 생성이 필요해 시간이
#                                                오래 걸린다. 사람이 확인한다.
#   D5  장소명 실제 생성·본문 일치·영구 거부    — 위치 권한 다이얼로그 조작과
#                                                실제 생성이 필요하다. 사람이
#                                                확인한다(완료, T040에서 권한
#                                                흐름까지 확인).
#   D6  로스터 5인 조사 확인                   — 실제 생성 5회가 필요하다.
#                                                사람이 확인한다.
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# ⚠️ 부분 문자열은 정규식으로 준다(007 실측). ⚠️ `childOf`를 쓰지 않는다
# (008 실측) — `testID`를 따로 준다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

- assertVisible: "일기"

# ★ M1 — **이번 주에 쓴 날이 있으면 홈에서 그 날의 본문이 보인다**(051 — 홈이 곧 상세).
#
# 051 전에는 「최근」 목록의 카드를 눌러 상세 화면을 열었다. 이제 목록·상세가 없고, 스트립의 점(일기
# 있음)이 찍힌 날을 누르면 그 자리에서 지면에 본문이 보인다. 이번 주에 쓴 날이 없으면 SKIPPED —
# 051 quickstart D1이 사람 확인으로 메운다(건너뛴 것은 통과가 아니다).
- runFlow:
    when:
      visible:
        id: "day-dot-.*"
    commands:
      - tapOn:
          id: "day-dot-.*"
      - assertVisible:
          id: "written-paper"
      - scrollUntilVisible:
          element:
            id: "written-body"
          direction: DOWN
          timeout: 20000
      # 사진을 본 일기면 캐러셀(1장이면 사진 하나)이 보인다 — 017 FR-001의 사진 영역.
      - runFlow:
          when:
            visible:
              id: "diary-photo"
          commands:
            - assertVisible:
                id: "diary-photo"
      # ★ 051 FR-016a — 「이 일기가 본 것」·소요 시간·작성자 문장이 지면에 없다(Clarifications).
      #   017 M2의 「소요 시간 문장이 보인다」를 뒤집었다.
      - assertNotVisible:
          text: ".*이렇게 일기를 작성했어요.*"
      - assertNotVisible:
          text: ".*걸렸어요.*"
      - assertNotVisible:
          text: ".*대표 장소.*"

# ★ M3 — **장소명 설정이 설정 탭 "장소명" 섹션에 있다**(FR-004~006).
#
# ⚠️ **2026-09-02 갱신(029)** — 017의 `GeocodingSettingToggle`이 홈에서 사라지고
# 설정 탭 "장소명" 섹션(3-상태: 자동/켬/끔, 기본 "자동")으로 옮겨졌다. 이제 기본이
# "자동"이라 고지 문구("좌표를 기기의 지도 서비스에 물어봅니다.")가 처음부터 떠
# 있을 수 있다 — "끔"을 골라야 사라진다(mode !== "off"일 때 고지).
- tapOn:
    id: "home-menu-button"
- tapOn:
    id: "home-menu-settings"
# ⚠️ 세 옵션을 개별 스크롤로 본다(025 실측 — 제목까지만 스크롤하면 마지막 옵션이 잘린다).
- scrollUntilVisible:
    element:
      id: "geocoding-auto"
    direction: DOWN
    timeout: 20000
- assertVisible: "장소 이름으로 보기"
- assertVisible:
    id: "geocoding-auto"
- scrollUntilVisible:
    element:
      id: "geocoding-on"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "geocoding-on"
- scrollUntilVisible:
    element:
      id: "geocoding-off"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "geocoding-off"

# ★ FR-006 — "켬"을 고르면 고지 문구가 그 자리에서 뜬다(원래 M3의 핵심).
- tapOn:
    id: "geocoding-on"
- assertVisible: "좌표를 기기의 지도 서비스에 물어봅니다."
- assertVisible: "선택"

# ★ 원칙 III·IV — 좌표·수치·모델 정보가 화면에 없다.
- assertNotVisible: "latitude"
- assertNotVisible: "longitude"
- assertNotVisible: "expo-location"

# ★ 029 — "끔"을 고르면 고지가 사라진다(mode === "off"). 기기 상태를 자동으로 되돌린다.
- tapOn:
    id: "geocoding-off"
- assertNotVisible: "좌표를 기기의 지도 서비스에 물어봅니다."
- tapOn:
    id: "geocoding-auto"
