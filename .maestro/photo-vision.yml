# 실기기 자동 테스트 — 사진의 내용을 보고 일기의 재료로 준다 (011)
#
# ─────────────────────────────────────────────────────────────────────────────
# **004가 사진의 장수와 좌표만 세던 것을, 사진 보는 모델이 한 장씩 읽어 일기의
# 재료로 준다.** 005 이후 처음으로 휴대폰이 눈을 뜬다.
#
# 검증 항목:
#   FR-015   사진 설정 셋이 보이고 고를 수 있다        (M1·M2)
#   FR-016   시각 인코더를 고르게 하지 않는다          (M3, 원칙 III)
#   FR-018   고른 적이 없으면 「보지 않음」이다        (M1)
#   FR-019a  무엇이 다른지 읽을 수 있다               (M1)
#   FR-020   오래 걸린다는 것을 고르기 전에 알린다     (M1)
#   FR-026   준비 상태가 하나의 값으로 보인다          (M4)
#   FR-031a  사진 보는 모델의 이름이 없다             (M4, 원칙 III)
#   FR-034   읽는 중 지표가 없다                      (M5, 원칙 IV)
#
# ─────────────────────────────────────────────────────────────────────────────
# **★ 여기서 자동화하지 않는 것 — quickstart.md D1~D8:**
#
#   D2  사진을 실제로 보았는가   — **이 기능의 핵심 검증이며 사람이 한다.**
#                                  같은 하루를 「보지 않음」과 「빠르게 봄」으로 각각
#                                  써서 **전문을 견주어야** 하고, 둘이 사실상 같으면
#                                  실패다. 「일기가 나왔다」는 「사진을 봤다」의 증거가
#                                  아니므로 자동으로 판정할 수 없다
#   D3  VLM→캐릭터 모델 전환      — **아무도 확인하지 않은 자리다**(research §2).
#                                  `narrative`(2.4B)로 해야 하고 죽으면 E1 순서를
#                                  다시 봐야 한다
#   D5  균일 선택                 — 010으로 사진 8~12장을 심고 일기의 시각 분포를
#                                  읽어야 한다. 사람이 읽어 판단한다
#   D6  깊이의 차이               — 「다른가」를 사람이 읽는다. **「어느 쪽이 나은가」는
#                                  판정하지 않는다**(원칙 IV)
#   D7  캡션 언어                 — 영어가 섞이는지 보고 **정한다**(미결)
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️ **`childOf`를 쓰지 않는다**(008 실측). RN 화면은 접근성 트리가 평탄화되어 줄 안의
# 글자가 **형제**로 나온다 — 그래서 설정마다 `testID`를 따로 준다.
#
# ⚠️ **부분 문자열은 정규식으로 준다**(007 실측). Maestro의 기본 매칭이 텍스트 노드
# 전체와 맞춰 보므로 「빠르게 봄」을 부분으로 찾으면 실패한다.
appId: com.anonymous.alpharium
---
- launchApp

# 일기 탭이 첫 화면이다(006 FR-009 유지).
- assertVisible: "일기"

# ★ M1 / FR-015 — **사진 설정을 고르는 자리가 있다.**
#
# **먼저 내려야 보인다**(007·009 실측). 캐릭터 다섯과 하루 셋 아래에 있으므로
# 첫 화면에서는 보이지 않는다 — 계층에는 있지만 Maestro가 보지 못한다.
#
# ⚠️ **017 — 셋을 각각 스크롤해 확인한다.** 017이 장소명 토글을 더해
# 화면이 길어지면서, 타이틀까지만 스크롤하면 `vision-none`이 아직 잘려
# 있고, `vision-none`까지만 스크롤하면 이번엔 `vision-quick`이 화면
# 아래로 밀린다(2026-08-24 실측) — 셋이 이제 한 화면에 다 들어오지
# 않으므로 각각 스크롤해서 본다.
- scrollUntilVisible:
    element:
      id: "vision-none"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "vision-none"

- scrollUntilVisible:
    element:
      id: "vision-quick"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "vision-quick"

- scrollUntilVisible:
    element:
      id: "vision-detailed"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "vision-detailed"

# ★ FR-019a — **무엇이 다른지 읽을 수 있다.**
#
# 설명이 「결과의 차이」로 쓰였는지 본다 — 「256토큰」이 아니라 「무엇이 달라지는가」다.
- assertVisible:
    text: ".*무엇이 담겼는지.*"

# ★ FR-020 — **오래 걸린다는 것을 고르기 전에 알린다**(원칙 III).
#
# 헌법이 「기다림처럼 사용자의 시간을 쓰는 것은 그 순간에 알린다」고 했고, 여기서는
# **고르기 전에** 알린다.
- assertVisible:
    text: ".*오래 걸린다.*"

# ★ M3 / FR-016 — **시각 인코더를 고르게 하지 않는다**(헌법 MUST NOT).
#
# 사용자가 보는 것은 「보지 않음/빠르게 봄/자세히 봄」뿐이며, 그 뒤의 모델은 모른다.
- assertNotVisible: "LFM"
- assertNotVisible: "SmolVLM"
- assertNotVisible: "mmproj"
- assertNotVisible: "gguf"
- assertNotVisible: "450M"
- assertNotVisible: "Q8"

# ★ 원칙 IV — 토큰 수·배수·초가 없다.
- assertNotVisible: "토큰"
- assertNotVisible: "256"
- assertNotVisible: "1024"

# ★ M2 / FR-015 — **고를 수 있고 고른 것이 표시된다.**
- tapOn:
    id: "vision-quick"
- assertVisible: "선택"

# 「자세히 봄」으로도 바꿔 본다 — 셋이 실제로 갈린다.
- tapOn:
    id: "vision-detailed"
- assertVisible: "선택"

# 다시 「보지 않음」으로 되돌린다 — 이 흐름이 기기 상태를 바꾼 채 끝나지 않게 한다.
#
# ⚠️ **되돌리지 않으면 다음 흐름이 사진을 읽으려다 10초를 쓴다.** 010이 「심은 하루는
# 검증의 대상이지 부산물이 아니다」로 정한 것과 반대 방향의 판단이다 — 여기서 바꾸는
# 것은 **설정**이고, 그것은 다음 흐름의 전제를 흔든다.
- tapOn:
    id: "vision-none"

# ★ M4 / FR-026·031a — **캐릭터 자리에 사진 보는 모델 줄이 있다.**
- tapOn: "캐릭터"
- scrollUntilVisible:
    element:
      id: "vision-row"
    direction: DOWN
    timeout: 20000

# 준비 상태가 **하나의 값으로** 보인다 — 파일이 둘이라는 것이 드러나지 않는다.
- assertVisible: "사진을 보는 데 필요한 것"
- assertNotVisible: "mmproj"
- assertNotVisible: "본체"
- assertNotVisible: "파일 2"

# ★ FR-031a — 모델 이름·파일명·크기가 없다(원칙 III).
- assertNotVisible: "LFM"
- assertNotVisible: "SmolVLM"
- assertNotVisible: "Liquid"
- assertNotVisible: "gguf"

# ★ 원칙 IV — 남은 시간·속도가 없다.
- assertNotVisible: "초 남"
- assertNotVisible: "/s"
