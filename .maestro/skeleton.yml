# 실기기 자동 테스트 — 뼈대 검증 (FR-021f)
#
# 시뮬레이터로 대체하지 않는다. 시뮬레이터에는 네이티브 추론 모듈이 없어 검증 대상
# 자체가 없기 때문이다.
#
# 검증 항목:
#   FR-001 앱이 실기기에서 뜬다
#   FR-006 추론 모듈 적재 상태를 확인할 수 있다
#   FR-012 실기기에서 추론 위치가 온디바이스다
#   FR-017 현재 환경과 추론 위치가 보인다
#
# 002 검증 항목:
#   파일 저장이 실기기에서 실제로 돈다 — expo-file-system 57의 File/Paths API를
#   이 저장소에서 처음 돌려보는 자리다. 나머지 002는 순수 함수라 npm test로 끝나지만
#   이 어댑터만은 실제 파일 시스템이 있어야 확인된다.
#
# 실행: npm run test:device (기기가 없거나 Maestro가 없으면 건너뛴다)
#
# 주의: 이 흐름은 앱이 실기기에서 온디바이스로 도는 것을 검증한다. dev 배포본이든
# local에서 실기기를 붙였든, 실기기라면 네이티브 모듈이 적재되고 추론은 기기에서
# 돌아야 한다. 환경 이름 자체는 검증하지 않는다 — Metro를 어느 env로 띄웠는지에
# 따라 달라지므로, 그것까지 고정하면 테스트가 실행 방식에 묶인다.
appId: com.anonymous.alpharium
---
- launchApp

# 014에서 진단 화면이 "개발자" 탭으로 옮겨졌다(local·dev 전용). 앱은 일기 목록으로
# 뜨므로 먼저 그 탭으로 간다. prod 빌드에는 이 탭이 없어 이 흐름 자체가 돌지 않는다.
- runFlow:
    when:
      visible: "개발자"
    commands:
      - tapOn: "개발자"

# FR-001 — 앱이 죽지 않고 뜨고, 진단 화면이 보인다
- assertVisible: "환경"
- assertVisible: "추론 위치"
- assertVisible: "모듈 상태"

# FR-006 — 온디바이스 추론 모듈이 적재됐다
# 이 줄이 이 기능의 진짜 검증이다. loaded가 아니면 온디바이스가 붙지 않은 것이다.
- assertVisible: "loaded"

# FR-012 — 실기기에서는 추론이 기기에서 돈다
- assertVisible: "on-device"

# 002 — 파일 저장이 실기기에서 실제로 돈다
# "저장 점검" 줄이 ok로 시작해야 한다. unavailable이면 어댑터가 붙지 않은 것이고,
# failed면 왕복 어딘가가 깨진 것이다 — 둘 다 통과가 아니다.
- assertVisible: "저장 점검"
- assertVisible:
    text: "ok — 저장·조회·덮어쓰기·unknown 보존 확인"
