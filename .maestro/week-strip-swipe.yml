# 실기기 자동 테스트 — 날 스트립을 이어 스크롤한다 (119, 이전 049 주 넘기기)
#
# ─────────────────────────────────────────────────────────────────────────────
# **오늘에서 끝나는 이어 스크롤.** 하루에 한 칸, 오른쪽 끝이 오늘이다. 스크롤만으로는 고른 날이
# 바뀌지 않고 칸을 눌러야 바뀐다. 오늘 다음 칸은 없다. (파일 이름은 049 그대로 둔다 — FLOWS·흐름 표 등록.)
#
# 검증 항목 (specs/119-strip-continuous-scroll):
#   FR-008   앱을 열면 오늘이 골라져 있고 오른쪽 끝에 보인다           (W1)
#   FR-006   오른쪽으로 밀면 지난날이 보이고, 고른 날(요일)은 그대로다   (W2)
#   FR-006   보이는 지난 칸을 누르면 그 날이 골라진다                  (W3)
#   FR-002   왼쪽으로 밀어 돌아오면 오늘 칸이 다시 보인다(그 뒤 칸 없음) (W4)
#
# **여기서 자동화하지 않는 것** — 관성·붙기의 손맛, 월 경계가 끊기지 않는 모습. 움직임은
# jest도 Maestro도 판정하지 못한다. 사람이 눈으로 본다(quickstart).
#
# 날짜는 기기의 오늘에 달렸으므로 적지 않고, 밀기 전후의 요일(`home-weekday`)을 복사해 비교한다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.a810labs.pocketlog
---
- launchApp
- runFlow: _dismiss-logbox.yml

- extendedWaitUntil:
    visible:
      id: "day-strip"
    timeout: 20000

# ★ W1 — 오늘이 골라져 있다(오늘 칸 = 밑줄).
- assertVisible:
    id: "day-today-.*"
# iOS는 날짜 버튼이 접근성 라벨(「날짜로 이동」)로 자식을 가려 큰 숫자(`home-day-number`)가 보이지 않는다 — 골라진 스트립 칸의 글자(「목, 22」)로 같은 것을 본다.
- runFlow:
    when:
      platform: Android
    commands:
      - copyTextFrom:
          id: "home-day-number"
- runFlow:
    when:
      platform: iOS
    commands:
      - copyTextFrom:
          id: "day-[0-9]{4}-[0-9]{2}-[0-9]{2}"
          selected: true
- evalScript: ${output.today = maestro.copiedText}
- copyTextFrom:
    id: "home-weekday"
- evalScript: ${output.weekday = maestro.copiedText}

# ★ W2 — 오른쪽으로 밀면 지난날이 보인다. 고른 날은 그대로(요일 그대로), 오늘 밑줄은 화면 밖이다.
- swipe:
    from:
      id: "day-strip"
    direction: RIGHT
- assertNotVisible:
    id: "day-today-.*"
- assertVisible:
    id: "home-weekday"
    text: ${output.weekday}

# ★ W3 — 보이는 지난 칸을 누르면 그 날이 골라진다.
- tapOn:
    id: "day-.*"
    selected: false
    enabled: true
- assertVisible:
    id: "day-.*"
    selected: true

# ★ W4 — 왼쪽으로 밀어 돌아오면 오늘 칸이 다시 보인다. 더 밀어도 오늘 뒤 칸은 없다.
- swipe:
    from:
      id: "day-strip"
    direction: LEFT
- swipe:
    from:
      id: "day-strip"
    direction: LEFT
- assertVisible:
    id: "day-today-.*"
