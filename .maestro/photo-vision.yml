# 실기기 자동 테스트 — 사진이 있는 하루는 VLM을 반드시 거친다 (011 → 029 → 042)
#
# ─────────────────────────────────────────────────────────────────────────────
# **★ 2026-09-14 갱신(042) — 이 흐름의 전제가 뒤집혔다.**
#
# 011이 만든 「사진 보기」 설정(보지 않음/빠르게 봄/자세히 봄)과 029가 더한 「자동」이
# **통째로 사라졌다.** 헌법 v1.7.0이 못 박았다 —
#
#   사진 접근이 허용되어 있으면 그 하루의 사진은 반드시 본다(MUST).
#   사용자가 이것을 끄는 경로를 두지 않는다(MUST NOT).
#   보는 깊이는 하나로 고정한다(MUST). 깊이를 고르게 하지 않는다(MUST NOT).
#
# 그래서 이 흐름은 이제 **「고를 수 있는가」가 아니라 「고를 자리가 없는가」**를 본다.
#
# 검증 항목:
#   042 FR-005  사진을 볼지 고르는 자리가 없다              (M1)
#   042 FR-006  깊이를 고르는 자리가 없다                   (M1)
#   042 SC-004  설정 탭에 사진 보기 선택지가 0개다          (M1)
#   011 FR-026  사진 모델의 준비 상태가 하나의 값으로 보인다 (M4, 유지)
#   011 FR-031a 사진 보는 모델의 이름이 없다                (M4, 원칙 III 유지)
#
# ─────────────────────────────────────────────────────────────────────────────
# **★ 여기서 자동화하지 않는 것 — quickstart.md D2·D3·D5·D6:**
#
#   D2  사진 있는 하루가 실제로 캡션을 도는가  — **이 기능의 핵심이며 사람이 한다.**
#                                                `adb logcat`의 `has_media=1`로 본다.
#   D3  0장인 하루가 엔진을 안 여는가          — 로그의 부재를 봐야 한다.
#   D5  백그라운드 자동 생성도 사진을 보는가   — **이 기능의 실질.** 잡을 강제 실행해야 한다.
#   D6  개발자 탭 「지금 생성」도 사진을 보는가
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️ **`childOf`를 쓰지 않는다**(008 실측). ⚠️ 부분 문자열은 정규식으로 준다(007 실측).
appId: com.anonymous.alpharium
---
- launchApp

# 일기 탭이 첫 화면이다(006 FR-009 유지).
- assertVisible: "일기"

# ★ 029 FR-001 — 홈에 사진 설정 선택기가 없다(042 이후에도 유지).
- assertNotVisible: "사진을 보지 않음"
- assertNotVisible: "빠르게 봄"
- assertNotVisible: "자세히 봄"

# ── 설정 탭으로 간다 ──────────────────────────────────────────────────
- tapOn: "설정"

# ★ M1 / 042 FR-005·FR-006·SC-004 — **사진 보기 설정이 통째로 없다.**
#
# 011의 네 선택지(자동/보지 않음/빠르게 봄/자세히 봄)와 그 설명 문구가 전부 사라졌다.
# testID로도 문안으로도 잡히지 않아야 한다.
- assertNotVisible:
    id: "vision-auto"
- assertNotVisible:
    id: "vision-none"
- assertNotVisible:
    id: "vision-quick"
- assertNotVisible:
    id: "vision-detailed"

- assertNotVisible: "사진을 어떻게 볼까"
- assertNotVisible: "사진을 보지 않음"
- assertNotVisible: "빠르게 봄"
- assertNotVisible: "자세히 봄"
- assertNotVisible: ".*그날 사진이 있으면.*없으면.*"
- assertNotVisible: ".*오래 걸린다.*"

# ★ 원칙 III·IV — 깊이가 사라졌으므로 그 수치도 당연히 없다.
- assertNotVisible: "토큰"
- assertNotVisible: "256"
- assertNotVisible: "1024"

# ★ M4 / 011 FR-026·031a — **사진 보는 모델의 준비 줄은 그대로 있다.**
#
# **설정이 사라진 것과 모델 준비 관리가 사라지는 것은 다르다**(042 FR-008).
# 사용자는 여전히 사진 보는 모델을 받고 지울 수 있어야 한다.
- scrollUntilVisible:
    element:
      id: "vision-row"
    direction: DOWN
    timeout: 20000
- assertVisible: "사진을 보는 데 필요한 것"
- assertNotVisible: "mmproj"
- assertNotVisible: "본체"
- assertNotVisible: "파일 2"

# ★ 011 FR-031a — 모델 이름·파일명·크기가 없다(원칙 III).
- assertNotVisible: "LFM"
- assertNotVisible: "SmolVLM"
- assertNotVisible: "Liquid"
- assertNotVisible: "gguf"

# ★ 원칙 IV — 남은 시간·속도가 없다.
- assertNotVisible: "초 남"
- assertNotVisible: "/s"
# 042 — 이 흐름은 기기 상태를 **바꾸지 않는다.** 되돌릴 설정 자체가 없어졌으므로
# 011·029가 끝에 두었던 「자동으로 되돌리기」 블록도 함께 사라졌다.
