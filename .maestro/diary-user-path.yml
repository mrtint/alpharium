# 실기기 자동 테스트 — 사용자 경로 (006 FR-009, SC-009)
#
# ─────────────────────────────────────────────────────────────────────────────
# **이 흐름이 006의 핵심을 본다: 진단 화면을 거치지 않고 일기에 닿는가.**
#
# 005까지는 생성 버튼이 진단 화면 안에만 있었고 그 화면은 local·dev에서만 열렸다.
# 배포 빌드를 손에 쥔 사람이 볼 수 있는 것은 캐릭터 목록뿐이었다.
#
# 검증 항목:
#   FR-009   진단을 거치지 않는 경로가 있다
#   FR-017   저장된 일기의 목록이 보인다
#   FR-018   일기가 없어도 빈 화면이 아니다        (S7)
#   FR-021   「쓰고 있다」에 진행률·시간·글이 없다  (S6, 원칙 IV)
#   FR-043   모델 정보가 화면에 없다               (S4, 원칙 III)
#
# **여기서 자동화하지 않는 것** — quickstart.md D7·D8·D11:
#   D7·D8(앱 종료·재부팅 뒤에도 남는가) — Maestro가 앱을 죽이고 되살리는 것으로는
#                                          기기 재부팅을 대신하지 못한다. 사람이 한다
#   D11(화자가 휴대폰인가)               — 의미를 읽어야 하며 기계로 채점하지 않는다
#                                          (원칙 IV)
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# 한글 검증 문구가 CP949로 뭉개지지 않는 것은 run-device-tests.mjs가
# JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8로 보장한다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

# FR-009 — **일기 탭이 첫 화면이다.** 진단을 거치지 않는다.
- assertVisible: "일기"

# FR-018·S7 — 일기가 없어도 빈 화면이 아니다.
#
# **어느 쪽이든 참인 것만 본다** — 기기에 일기가 있을 수도 없을 수도 있으므로,
# 「쓰기 자리가 있다」를 본다. 그것이 두 경우 모두에서 참이다.
#
# ⚠️ **017 — 스크롤해야 보인다.** 017이 사진 설정·장소명 토글을 더해
# 화면이 길어지면서, "일기 쓰기" 버튼이 첫 화면 아래로 밀렸다
# (2026-08-24 실측).
- scrollUntilVisible:
    element:
      text: "일기 쓰기"
    direction: DOWN
    timeout: 20000
- assertVisible: "일기 쓰기"

# ★ 원칙 III — 모델 정보가 화면에 없다 (S4, SC-019).
- assertNotVisible: "kanana"
- assertNotVisible: "exaone"
- assertNotVisible: "hyperclova"
- assertNotVisible: "qwen"
- assertNotVisible: "gemma"
- assertNotVisible: "gguf"
- assertNotVisible: "Q4"

# ★ 원칙 IV — 지표가 화면에 없다 (S5, SC-020).
- assertNotVisible: "토큰"
- assertNotVisible: "남음"

# 쓰기를 눌러 본다.
#
# **모델이 없으면 「캐릭터를 먼저 준비해야 한다」로 끝나고 그것이 정상이다** —
# 이 흐름은 「일기가 나온다」를 보지 않는다. 보는 것은 **눌렀을 때 무너지지 않고
# 무엇을 할 수 있는지 말해 주는가**이다.
- tapOn: "일기 쓰기"

# ★ FR-021·S6 — 「쓰고 있다」에 진행률·시간·생성 중인 글이 없다.
#
# 누른 직후에 본다. 모델이 없으면 즉시 끝나므로 이 검사는 어느 쪽이든 참이어야 한다.
- assertNotVisible: "%"
- assertNotVisible: "남음"
- assertNotVisible: "초 남"

# 어떻게 끝나든 「쓰고 있다」가 남아 있지 않다.
#
# 모델이 없으면 즉시, 있으면 30초 안팎이 걸린다(005 실측). 넉넉히 기다린다.
- extendedWaitUntil:
    notVisible: "쓰고 있다"
    timeout: 240000

# ★ 원칙 III — 실패가 「할 수 있는 것」으로 옮겨진다 (S8).
- assertNotVisible: "되뱉"
- assertNotVisible: "echo"
- assertNotVisible: "language"
- assertNotVisible: "unfinished"
- assertNotVisible: "rejected"
- assertNotVisible: "storage"

# 캐릭터 탭으로 갈 수 있다 — 003의 준비 화면이 사용자 경로에 이어져 있다(FR-028).
- tapOn: "캐릭터"
- assertVisible: "캐릭터"
