# iOS 시뮬레이터 — 설정 화면의 모든 행을 눌러 본다 (068, 훑기).
#
# ─────────────────────────────────────────────────────────────────────────────
# **`scripts/run-device-tests.mjs`의 `FLOWS`에 등록하지 않았다** — 등록하지 않은 흐름은 아무것도 검증하지 않는다(AGENTS 「Maestro」).
# 훑기 도구다: 이 흐름이 끝까지 간다는 것은 「앱이 살아 있고 화면이 이어졌다」뿐이다. **Metro 로그의 `ERROR`와 `xcrun simctl spawn booted log show`는
# 사람이(또는 이 흐름 밖에서) 따로 읽는다** — 개발 빌드는 오류를 화면 아래 알림으로만 보이고 앱을 죽이지 않기 때문이다(068 실측).
#
# 앱이 홈에 있는 상태에서 시작한다(`first-run-to-home.yml` 뒤). 앱 설정으로 나가는 행은 `launchApp: stopApp: false`로 돌아온다 —
# **기본 `launchApp`은 앱을 종료했다 다시 띄워 상태가 사라진다**(크래시와 구분이 안 된다).
# 안 지우는 행: 「일기 모두 지우기」는 확인 대화상자까지만 열고 취소한다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.a810labs.pocketlog
---
- launchApp:
    stopApp: false
- runFlow: _dismiss-open-prompt.yml
# 이전 실행이 설정에서 멈췄다면 홈으로 돌아와 시작한다.
- runFlow:
    when:
      visible:
        id: "settings-screen"
    commands:
      - tapOn:
          id: "back-to-home"
- tapOn:
    id: "home-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

# 이름 바꾸기 → 뒤로
- tapOn:
    id: "settings-name"
- extendedWaitUntil:
    visible:
      id: "rename-save"
    timeout: 5000
- tapOn:
    id: "rename-back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000

# 자동으로 쓰기 토글(켜면 시각 행이 펼쳐진다) → 시각 대화상자 → 취소
# 꺼져 있으면 켠다(켜면 「매일 쓰는 시각」 행이 펼쳐진다)
- runFlow:
    when:
      notVisible: "매일 쓰는 시각"
    commands:
      - tapOn:
          id: "auto-diary-toggle"
# iOS XCUITest는 접힘 애니메이션 안쪽 행의 testID를 못 찾는다(068 실측) — 글자로 찾는다.
- extendedWaitUntil:
    visible: "매일 쓰는 시각"
    timeout: 5000
- tapOn: "매일 쓰는 시각"
- extendedWaitUntil:
    visible:
      id: "target-hour-dialog"
    timeout: 5000
- tapOn:
    id: "target-hour-cancel"
- extendedWaitUntil:
    notVisible:
      id: "target-hour-dialog"
    timeout: 5000
# 토글을 원래대로(꺼짐)
- tapOn:
    id: "auto-diary-toggle"

# 장소 이름으로 보기 → 취소
- tapOn:
    id: "settings-place-names"
- extendedWaitUntil:
    visible:
      id: "place-name-dialog"
    timeout: 5000
- tapOn:
    id: "place-name-cancel"
- extendedWaitUntil:
    notVisible:
      id: "place-name-dialog"
    timeout: 5000

# 권한 행 — 앱 설정으로 나갔다가 같은 프로세스로 돌아온다
- scrollUntilVisible:
    element:
      id: "settings-perm-photos"
- tapOn:
    id: "settings-perm-photos"
- launchApp:
    stopApp: false
- runFlow: _dismiss-open-prompt.yml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "settings-perm-location"
- tapOn:
    id: "settings-perm-location"
- launchApp:
    stopApp: false
- runFlow: _dismiss-open-prompt.yml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "settings-perm-notifications"
- tapOn:
    id: "settings-perm-notifications"
- launchApp:
    stopApp: false
- runFlow: _dismiss-open-prompt.yml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "settings-perm-battery"
- tapOn:
    id: "settings-perm-battery"
- launchApp:
    stopApp: false
- runFlow: _dismiss-open-prompt.yml
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000

# 이 휴대폰 — 일기 모두 지우기는 확인 대화상자까지만(취소)
- scrollUntilVisible:
    element:
      id: "settings-wipe"
- runFlow:
    when:
      visible:
        id: "settings-wipe"
    commands:
      - tapOn:
          id: "settings-wipe"
- runFlow:
    when:
      visible:
        id: "wipe-dialog"
    commands:
      - tapOn:
          id: "wipe-cancel"

# 버전(개발 환경은 7번 탭 없이 개발자 행이 처음부터 있다)
- scrollUntilVisible:
    element:
      id: "settings-version"
- takeScreenshot: ios-settings-bottom
- tapOn:
    id: "back-to-home"
- extendedWaitUntil:
    visible:
      id: "home-settings"
    timeout: 5000
