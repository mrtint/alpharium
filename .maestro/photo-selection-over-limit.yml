# 실기기 자동 테스트 — 023 상한 초과 하루의 사진 선별·캡션 (T031·T036)
#
# ─────────────────────────────────────────────────────────────────────────────
# **023의 quickstart D2·D3을 실기기에서 트리거하는 흐름이다.**
#
# `many-camera`(12장, `folder` 미지정 → 카메라 원본으로 분류)를 심은 하루를
# 골라 「빠르게 봄」으로 `quiet`(금동이) 생성을 건다. 목적은:
#   D3(T031) — 캡션 장당·누적 시간, VLM 적재 + 캐릭터 모델 로드 시간,
#              캡션 N장이 들어간 캐릭터 프롬프트 토큰 수 대 n_ctx
#   D2(T036) — 캡션된 사진의 시각 분포가 하루에 걸치는가(몰린 칸 독점 안 함)
#
# **이 흐름은 「생성이 무너지지 않고 완주하는가」까지만 자동으로 본다.** 캡션 시간·
# 토큰 수·시각 분포는 `adb logcat`을 사람이 읽어 판단한다(원칙 IV·V) — 흐름은
# 관찰의 무대를 세울 뿐 값을 채점하지 않는다.
#
# ⚠️ **2026-09-02 갱신(029)** — 홈에서 캐릭터·사진 설정 위젯이 사라졌다.
#   캐릭터: 자동 판정이 "마지막에 쓴 캐릭터"(없으면 온보딩 기본=금동이)를 쓴다.
#           이 흐름은 금동이가 마지막이거나 유일 준비 캐릭터인 상태를 전제한다.
#   사진 설정: 042가 설정 자체를 없앴다 — 사진이 있으면 언제나 본다. 예전 흐름이 설정 탭의
#           `vision-quick`·`vision-auto`를 누르다 실패했다(049 실기기에서 발견·제거).
#
# 선행: `npm run seed:day -- many-camera <날짜>` (Phase 8 도구). 그 날짜를
#        `SEED_DAY` env로 넘긴다.
#
# ⚠️ **049** — 지난 날은 모두 고를 수 있다(009의 사흘 범위는 화면에서 풀렸다). 스트립을
#   주 단위로 넘겨 그 날을 찾으므로 8주 안이면 된다. `-e SEED_DAY=<심은 날>`로 덮어쓴다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
env:
  # ★ 흐름의 `env`가 `-e`를 덮어쓴다 — 기본값은 `||`로 준다(Maestro 문서 「Setting default values」).
  # 예전의 `SEED_DAY: "2026-09-01"`은 `-e`를 무시하고 사진 없는 9/1을 썼다(049 실기기에서 발견).
  SEED_DAY: ${SEED_DAY || "2026-09-01"}
---
- launchApp
- assertVisible: "일기"

# ── 하루: many-camera를 심은 날 ──
# 049 — 스트립은 고른 날이 든 일~토 주다. 심은 날이 지난 주면 오른쪽으로 넘겨 그 주로 간다
# (한 번에 한 주, 최대 8주).
- scrollUntilVisible:
    element:
      id: "day-strip"
    direction: DOWN
    timeout: 20000
- repeat:
    times: 8
    while:
      notVisible:
        id: "day-${SEED_DAY}"
    commands:
      - swipe:
          from:
            id: "day-strip"
          direction: RIGHT
- tapOn:
    id: "day-${SEED_DAY}"

# ── 생성: "일기 쓰기" 1탭 (029 — 캐릭터는 자동 판정) ──
- scrollUntilVisible:
    element:
      id: "write-button"
    direction: DOWN
    timeout: 20000
# 051 — 쓴 날에는 같은 버튼이 「다시 쓰기」다(기본 선택 = 오늘). id로 누른다(FR-037a).
- tapOn:
    id: "write-button"

# 이미 일기가 있으면 덮어쓰기 확인 — 「다시 쓰기」를 눌러 진행한다(012 → 050 홈 위 대화상자).
- runFlow:
    when:
      visible:
        id: "overwrite-dialog"
    commands:
      - tapOn:
          id: "overwrite-confirm"

# ★ 원칙 IV — 생성 중에 지표가 없다.
- assertNotVisible: "%"
- assertNotVisible: "토큰"
- assertNotVisible: "초 남"
- assertNotVisible: "단계"

# ★ 완주한다 — 12장 캡션 + 캐릭터 생성은 몇 분 걸릴 수 있다(019 실측 최장
#   2분 27초, 상한이 8로 오르면 더 길다). 넉넉히 기다린다.
#   ⚠️ 쓰는 화면 문구는 015 이후 「…중…」 독백이라 「쓰고 있다」를 기다리면 즉시 통과해 버렸다
#   (049 실기기 — 흐름은 PASS인데 일기는 아직 쓰는 중이었다). 쓰는 화면에만 있는 「그만두기」가
#   사라질 때까지 기다린다.
- extendedWaitUntil:
    notVisible: "그만두기"
    timeout: 420000

# ★ 원칙 III — 실패가 모델 용어로 새지 않는다.
- assertNotVisible: "되뱉"
- assertNotVisible: "echo"
- assertNotVisible: "unfinished"
- assertNotVisible: "rejected"

# 051 — 홈이 곧 상세다. 일기가 나왔으면 결과 화면 없이 홈의 그 날로 돌아와 지면에 본문이 보인다.
# 실패·저장 실패 화면이면 「← 일기」로 홈에 돌아간다(흐름이 상태를 바꾼 채 끝나지 않게).
- runFlow:
    when:
      visible: "← 일기"
    commands:
      - tapOn: "← 일기"
- runFlow:
    when:
      visible:
        id: "written-body"
    commands:
      - assertVisible:
          id: "home-day-title"
