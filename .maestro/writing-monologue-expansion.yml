# 실기기 자동 테스트 — 쓰는 중 독백 확장 (016)
#
# ─────────────────────────────────────────────────────────────────────────────
# **이 흐름이 016의 User Story 1을 본다** — 모델 로드 구간(콜드/핫 스타트)
# 문구가 실제로 뜨는가.
#
# 015의 `.maestro/writing-monologue.yml`이 신호 확인·사진 보기·글쓰기
# 세 단계를 이미 검증한다. 016은 그 사이(사진 보기와 글쓰기 사이)에 새로
# 낀 모델 로드 단계만 추가로 본다 — 015가 이미 보는 것을 다시 보지 않는다.
#
# 검증 항목 (quickstart.md B1·B2 대응):
#   FR-001·FR-002   모델 로드 구간에서 콜드/핫을 구분하는 문구가 보인다
#   FR-004          문구에 숫자·퍼센트가 없다 (원칙 IV)
#
# **⚠️ [2026-08-23] FR-003(문구에 캐릭터 이름 포함)은 철회됐다** — 문구
# 검수 과정에서 사용자가 이름 주입 기능 자체를 뺐다. 로드 단계 문구는
# 이름을 포함하지 않는다.
#
# **콜드 스타트가 최대 242초까지 걸릴 수 있다**(로드맵 실측, 루이/narrative
# 기준) — 대기 시간을 넉넉히 준다.
#
# **여기서 자동화하지 않는 것**:
#   - quickstart.md B3(장수 많음/보통) — 사진 5장 이상인 하루를 심어야
#     하고, 무작위 선택이라 재시도가 필요해 Maestro로 안정적으로 재현하기
#     어렵다. 010 seed:day 도구로 손으로 확인한다.
#   - quickstart.md B4(정직성 경계) — 코드 검사(monologue.test.ts)가 이미
#     본다. 화면에서 우연히 뜨기를 기다리는 것보다 정적 검사가 확실하다.
#   - quickstart.md B5(로드 실패) — 모델을 일부러 지운 상태를 준비해야
#     한다.
#   - quickstart.md B6(로드 도중 취소) — 정확한 타이밍(로드 시작 직후
#     그만두기)이 Maestro로 재현하기 어렵다.
#
# **⚠️ [2026-08-23 최초 실행 결과]** SM-G986N에서 이 파일을 그대로
# 돌리면 line 44의 `assertVisible: "일기 쓰기"`에서 실패한다 — 캐릭터
# 5개·과거 하루 3개가 누적된 현재 화면 상태에서 "일기 쓰기" 버튼이
# 스크롤 없이는 뷰포트 밖에 있다. **015의 기존 `.maestro/writing-
# monologue.yml`도 이 세션에서 동일하게 실패했다** — 016이 만든 회귀가
# 아니라 화면 콘텐츠 누적에 따른 사전 존재 이슈로 보이며, 이 파일에서는
# 고치지 않고 별도 사안으로 남긴다.
#
# 스크롤을 추가한 임시본으로는 "일기 쓰기" 탭 → 덮어쓰기 확인까지는
# 정상 동작했고 "쓰고 있다"가 뜨는 것도 확인됐으나, 이 세션의 기기
# 상태(파일시스템 캐시가 따뜻함, 사진 3장)에서는 신호 확인→사진 보기→
# 모델 로드→글쓰기 전체가 수 초 내로 끝나 `extendedWaitUntil`의 폴링
# 간격보다 로드 단계가 짧게 지나갔다 — 로드 단계 문구 자체는 이 세션
# 에서 자동화로도 육안으로도 붙잡지 못했다(기기 없는 테스트로는 반환
# 로직이 검증됨, tasks.md T024 참조). **자동화되지 않았다고, 혹은
# 아직 실행하지 않았다고 통과한 것이 아니다**(원칙 V).
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

- assertVisible: "일기"
- assertVisible: "일기 쓰기"

- tapOn: "일기 쓰기"

# FR-004 — 로드 구간 문구에도 숫자·퍼센트가 없다.
- assertNotVisible: "%"
- assertNotVisible: "남음"
- assertNotVisible: "초 남"
- assertNotVisible: "토큰"

# ─────────────────────────────────────────────────────────────────────────────
# 모델 로드 구간(콜드/핫)은 실제로 쓰는 중일 때만, 그리고 사진 보기 단계를
# 지난 뒤에만 온다 — 015 흐름과 같은 조건부 구조를 쓴다.
# ─────────────────────────────────────────────────────────────────────────────
- runFlow:
    when:
      visible: "쓰고 있다"
    commands:
      # 로드 단계 문구(콜드 또는 핫)가 뜨는지 넉넉히 기다린다. 콜드 스타트가
      # 242초까지 걸릴 수 있으므로 대기 시간을 길게 잡는다.
      - extendedWaitUntil:
          visible: ".*(준비를|정리하고|정돈하는|자리에 앉는|채비를|가다듬는|잡는|시작하는).*"
          timeout: 250000

      # "순번·진행률이 아닌 준비 관련 문구가 실제로 보였다"는 사실 자체를
      # 위 단계에서 이미 확인했다(이름은 포함하지 않는다, 2026-08-23 철회)
      # — 여기서는 완료까지 정상 전환되는지만 마저 본다.
      - extendedWaitUntil:
          notVisible: "쓰고 있다"
          timeout: 250000

      - assertNotVisible: ".*(들여다보는|살펴보는|눈에 담는|기록을 확인하는|되짚어보는|헤아리는|문장으로 옮기는|적어보는|준비를|정리하고|정돈하는).*"

- assertNotVisible: "되뱉"
- assertNotVisible: "rejected"
- assertNotVisible: "unfinished"
