# 실기기 자동 테스트 — 023 상한 초과 하루의 사진 선별·캡션 (T031·T036)
#
# ─────────────────────────────────────────────────────────────────────────────
# **023의 quickstart D2·D3을 실기기에서 트리거하는 흐름이다.**
#
# `many-camera`(12장, `folder` 미지정 → 카메라 원본으로 분류)를 심은 하루를
# 골라 「빠르게 봄」으로 `quiet`(금동이) 생성을 건다. 목적은:
#   D3(T031) — 캡션 장당·누적 시간, VLM 적재 + 캐릭터 모델 로드 시간,
#              캡션 N장이 들어간 캐릭터 프롬프트 토큰 수 대 n_ctx
#   D2(T036) — 캡션된 사진의 시각 분포가 하루에 걸치는가(몰린 칸 독점 안 함)
#
# **이 흐름은 「생성이 무너지지 않고 완주하는가」까지만 자동으로 본다.** 캡션 시간·
# 토큰 수·시각 분포는 `adb logcat`을 사람이 읽어 판단한다(원칙 IV·V) — 흐름은
# 관찰의 무대를 세울 뿐 값을 채점하지 않는다.
#
# ⚠️ **2026-09-02 갱신(029)** — 홈에서 캐릭터·사진 설정 위젯이 사라졌다.
#   캐릭터: 자동 판정이 "마지막에 쓴 캐릭터"(없으면 온보딩 기본=금동이)를 쓴다.
#           이 흐름은 금동이가 마지막이거나 유일 준비 캐릭터인 상태를 전제한다.
#   사진 설정: 설정 탭 "사진 보기"에서 "빠르게 봄"으로 고정한다(자동 판정을 덮어씀).
#
# 선행: `npm run seed:day -- many-camera <날짜>` (Phase 8 도구). 그 날짜를
#        `SEED_DAY` env로 넘긴다.
#
# ⚠️ **2026-09-03 갱신(032)** — `SEED_DAY`는 009의 선택 범위 안이어야 한다
#   (마지막 닫힌 하루 + 앞 둘 = 3개). 고정 날짜는 며칠 지나면 범위를 벗어나
#   `day-<날짜>` pill이 사라진다 — 실행 직전에 `npm run seed:day -- many-camera
#   <어제>`로 다시 심고 `-e SEED_DAY=<어제>`로 덮어쓴다. 아래 기본값은
#   "심은 직후 실행" 전제의 예시일 뿐이다.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
env:
  SEED_DAY: "2026-09-01"
---
- launchApp
- assertVisible: "일기"

# ── 사진 설정: 설정 탭 "사진 보기"에서 「빠르게 봄」 고정 ──
# 자동 판정("자동")이면 사진 있는 날은 어차피 "빠르게 봄"이 되지만, 이 흐름은
# 상한 초과 캡션을 확실히 트리거하려고 명시적으로 고정한다.
- tapOn: "설정"
- scrollUntilVisible:
    element:
      id: "vision-quick"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "vision-quick"
- assertVisible: "선택"
- tapOn: "일기"

# ── 하루: many-camera를 심은 날 ──
- scrollUntilVisible:
    element:
      id: "day-${SEED_DAY}"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "day-${SEED_DAY}"

# ── 생성: "일기 쓰기" 1탭 (029 — 캐릭터는 자동 판정) ──
- scrollUntilVisible:
    element:
      text: "일기 쓰기"
    direction: DOWN
    timeout: 20000
- tapOn: "일기 쓰기"

# 이미 일기가 있으면 덮어쓰기 확인 — 확인을 눌러 진행한다(012).
- runFlow:
    when:
      visible: ".*덮어쓴다.*"
    commands:
      - tapOn: "확인"
- runFlow:
    when:
      visible: ".*덮어쓸지 확인.*"
    commands:
      - tapOn: "확인"

# ★ 원칙 IV — 생성 중에 지표가 없다.
- assertNotVisible: "%"
- assertNotVisible: "토큰"
- assertNotVisible: "초 남"
- assertNotVisible: "단계"

# ★ 완주한다 — 12장 캡션 + 캐릭터 생성은 몇 분 걸릴 수 있다(019 실측 최장
#   2분 27초, 상한이 8로 오르면 더 길다). 넉넉히 기다린다.
- extendedWaitUntil:
    notVisible: "쓰고 있다"
    timeout: 420000

# ★ 원칙 III — 실패가 모델 용어로 새지 않는다.
- assertNotVisible: "되뱉"
- assertNotVisible: "echo"
- assertNotVisible: "unfinished"
- assertNotVisible: "rejected"

# 상세 화면이 떴으면 일기가 나온 것이다 — 「← 목록」으로 돌아가
# 흐름이 상태를 바꾼 채 끝나지 않게 한다. 사진 보기 설정도 "자동"으로 되돌린다.
- runFlow:
    when:
      visible: "← 목록"
    commands:
      - tapOn: "← 목록"
- tapOn: "설정"
- scrollUntilVisible:
    element:
      id: "vision-auto"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "vision-auto"
