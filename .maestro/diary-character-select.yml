# 실기기 자동 테스트 — 일기 작성자 선택 (007 → 029로 설정 탭 이동)
#
# ─────────────────────────────────────────────────────────────────────────────
# **007의 "누가 쓰는지 고를 수 있는가"가 029에서 설정 탭 "일기 작성자" 섹션으로
# 옮겨졌다**(Q1=A, "캐릭터" 탭 흡수). 홈에는 더 이상 캐릭터 선택기가 없다.
#
# 검증 항목:
#   029 FR-001·SC-002   홈에 캐릭터 선택기가 없다
#   029 FR-023          설정 탭에 "일기 작성자" 섹션이 있다
#   029 FR-023·027      각 항목이 persona 이름·소개만 보이고 모델 정보가 없다 (원칙 III)
#   014 로스터 MUST     오드는 "상상력이 풍부해요"로 그 사실을 알린다
#   029 FR-023          준비된 캐릭터를 작성자로 고를 수 있다
#   029 FR-023          미준비 캐릭터는 "아직 준비되지 않음"으로 표시된다 (원칙 V)
#
# **여기서 자동화하지 않는 것** — quickstart.md Q4:
#   고정한 캐릭터로 실제 일기가 쓰이는가  — 생성 + 모델 파일이 필요하다. 사람이 한다.
#   미준비 캐릭터 다운로드                — GB 단위 재내려받기가 따른다. 사람이 한다.
#   release 빌드에서 도는가               — 빌드가 19분이다. 사람이 한다(012 기준: 생략).
#
# **자동화되지 않았다고 통과한 것이 아니다**(원칙 V).
#
# ⚠️ 부분 문자열은 정규식으로 준다(007 실측). ⚠️ testID로 짚는다(R8 생존, 007 실측).
# ⚠️ 개발자 탭은 dev 빌드에만 있다 — 설정 탭은 prod에도 있다(020 FR-001).
# ─────────────────────────────────────────────────────────────────────────────
appId: com.anonymous.alpharium
---
- launchApp

# 일기 탭이 첫 화면이다(006 FR-009 유지).
- assertVisible: "일기"

# ★ 029 FR-001·SC-002 — **홈에 캐릭터 선택기가 없다.**
# 006~018이 홈에 쌓은 "누가 쓸까" 자리가 029에서 사라졌다.
- assertNotVisible: "누가 쓸까"
- assertNotVisible: "누가 쓸까요"

# ── 설정 탭으로 간다 ───────────────────────────────────────────────────
- tapOn: "설정"

# ★ 029 FR-023 — **설정 탭에 "일기 작성자" 섹션이 있다.**
- scrollUntilVisible:
    element:
      id: "author-picker"
    direction: DOWN
    timeout: 20000
- assertVisible: "일기 작성자"

# ★ 029 FR-023·027 — persona 이름·소개가 보인다(원칙 III).
# 014가 표시 이름을 내부 키에서 persona 이름으로 바꿨다 — 금동이·루이·오드·샤오바이·모카.
#
# ⚠️ **각 항목을 개별 스크롤로 본다**(025 실측). `author-picker`까지만 스크롤하면
# 컨테이너 상단에서 멈춰 두 번째 항목("루이")부터는 화면 밖이다. testID로 짚어
# 하나씩 스크롤한다.
- scrollUntilVisible:
    element:
      id: "author-option-0"
    direction: DOWN
    timeout: 20000
- assertVisible: "금동이"
- scrollUntilVisible:
    element:
      id: "author-option-1"
    direction: DOWN
    timeout: 20000
- assertVisible: "루이"
- scrollUntilVisible:
    element:
      id: "author-option-2"
    direction: DOWN
    timeout: 20000
- assertVisible: "오드"

# ★ 014 헌법 로스터 MUST — 오드는 상상을 섞는다는 것을 소개 문구로 알린다.
# 별도 고지(`IMAGINATIVE_NOTICE`)는 014 헌법 1.1.1 개정으로 없앴고 tagline 자체가
# 강점의 언어로 그 사실을 담는다 — 화면 문구는 "상상력이 풍부해요"다.
- assertVisible:
    text: ".*상상력이 풍부.*"

# ★ 029 FR-023·027 — 고르는 자리에 모델 정보가 없다(원칙 III).
- assertNotVisible: "kanana"
- assertNotVisible: "exaone"
- assertNotVisible: "hyperclova"
- assertNotVisible: "qwen"
- assertNotVisible: "gemma"
- assertNotVisible: "gguf"
- assertNotVisible: "Q4"
- assertNotVisible: "파라미터"

# 007 FR-008 — 추천 표시가 없다. 다섯이 같은 자격이다.
- assertNotVisible: "추천"
- assertNotVisible: "권장"

# ★ 029 FR-023 — **준비된 캐릭터는 작성자로 고를 수 있고, 미준비는 그렇게 표시된다.**
# 이 기기에 준비된 캐릭터가 하나 이상 있으면 그 행을 누른다. 준비 상태는 기기에
# 달렸으므로(어떤 모델을 받아 뒀는가), "작성자" 표식이 어느 행에든 하나는 있어야
# 한다 — 자동 판정이 항상 작성자를 하나 정하기 때문이다(resolve-generation R1~R3).
- assertVisible: "작성자"

# 미준비 캐릭터가 있으면 "아직 준비되지 않음"이 보인다(원칙 V — 없음과 모름의 구분).
# 다섯을 다 받아 둔 기기에서는 이 문구가 없는 것이 정상이므로 조건부로 본다.
- runFlow:
    when:
      visible: ".*아직 준비되지 않음.*"
    commands:
      - assertVisible:
          text: ".*아직 준비되지 않음.*"

# 준비된 다른 캐릭터로 바꿔 본다 — author-option-2(오드)가 준비돼 있으면 누른다.
# (준비 안 됐으면 disabled라 눌러도 onSelect가 안 불리고, 그것도 정상이다.)
- runFlow:
    when:
      visible:
        id: "author-option-2"
    commands:
      - tapOn:
          id: "author-option-2"

# 설정 탭을 벗어나도 크래시가 없다.
- tapOn: "일기"
- assertVisible: "일기 쓰기"
